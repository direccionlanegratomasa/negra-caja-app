<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cierre de Caja</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F6F4EE;
  --paper-alt:#EDEAE0;
  --card:#FFFFFF;
  --ink:#1C2321;
  --ink-soft:#6B756F;
  --line:#D8D3C6;
  --brand:#FFD400;
  --brand-light:#FFF6D0;
  --brand-deep:#9C6F00;
  --success:#1B5E4A;
  --success-light:#DCEAE3;
  --success-dark:#0F3D30;
  --red:#B23A2E;
  --red-light:#F6DEDA;
  --gold:#A9761F;
  --gold-light:#F3E6C4;
  --radius:12px;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  --sans:'Space Grotesk', system-ui, -apple-system, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body{ margin:0; }

.app{
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper);
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 100px;
}

/* ---- Top bar ---- */
.sticky-head{ position: sticky; top:0; z-index:20; }
.topbar{
  background: var(--brand);
  color: #2B2107;
  padding: 14px 16px 12px;
}
.topbar-title{
  font-size: 17px; font-weight:700; letter-spacing:.2px; margin:0 0 2px;
}
.topbar-sub{ font-size:11px; color:#6B5100; font-family:var(--mono); margin:0; }
.brand-row{ display:flex; align-items:center; gap:10px; }
.brand-icon{ height:44px; width:auto; flex-shrink:0; }
.brand-word{ height:34px; width:auto; }
.tabs{ display:flex; gap:6px; margin-top:12px; }
body.kb-open .tabs{ display:none; }
body.kb-open .topbar{ padding-bottom:8px; }
body.kb-open .topbar-sub{ display:none; }
.tab{
  flex:1; text-align:center; padding:9px 4px; border-radius:8px;
  font-size:12.5px; font-weight:500; color:#5C4400; background:transparent;
  border:1px solid rgba(43,33,7,0.25); cursor:pointer;
}
.tab.active{ background:#2B2107; color:#FDF1CE; border-color:#2B2107; font-weight:700; }

/* ---- Ticket tape (live readout) ---- */
.tape{
  margin: 0 16px; border-radius: 0 0 8px 8px;
  background: var(--ink);
  color:#EFE9C9;
  padding: 9px 14px;
  font-family: var(--mono);
  font-size: 12.5px;
  display:flex; justify-content:space-between; align-items:center;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}
.tape .lbl{ color:#9FB0A8; }
.tape .val{ font-weight:600; font-size:14px; }
.tape.diff-ok .val{ color:#8CE0B0; }
.tape.diff-bad .val{ color:#F0958B; }

/* ---- Sections (ticket cards) ---- */
.wrap{ padding: 16px 16px 4px; }
.card{
  background: var(--card);
  border: 1.5px dashed var(--line);
  border-radius: var(--radius);
  margin-bottom: 16px;
  overflow:hidden;
  position:relative;
}
.card::before, .card::after{
  content:""; position:absolute; width:14px; height:14px; border-radius:50%;
  background: var(--paper); top:-7px;
}
.card::before{ left:-7px; }
.card::after{ right:-7px; }
.card-head{
  background: var(--brand-light);
  color: var(--brand-deep);
  padding: 10px 14px;
  font-size: 12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
  display:flex; align-items:center; gap:8px;
}
.card-num{
  width:20px; height:20px; border-radius:50%; background:var(--brand-deep); color:#FDF1CE;
  font-size:11px; font-family:var(--mono); display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.card-body{ padding: 14px; }

.field{ margin-bottom: 12px; }
.field:last-child{ margin-bottom:0; }
.field label{
  display:block; font-size:11.5px; color: var(--ink-soft); margin-bottom:5px; font-weight:500;
}
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea{
  width:100%; border:1.5px solid var(--line); border-radius:8px; padding:10px 11px;
  font-family: var(--sans); font-size:15px; color: var(--ink); background:#FCFBF8;
}
select{
  appearance:none; -webkit-appearance:none; -moz-appearance:none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236B756F' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
  background-repeat:no-repeat; background-position: right 10px center; padding-right:34px;
}
select:invalid, select option[value=""]{ color: var(--ink-soft); }
input[type=number]{ font-family: var(--mono); }
textarea{ min-height:70px; resize:vertical; font-family:var(--sans); }
input:focus, select:focus, textarea:focus{ outline:none; border-color: var(--brand-deep); background:#fff; }
.hint{ font-size:11px; color: var(--ink-soft); margin-top:4px; }

.row2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.amount-row{
  display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:end; margin-bottom:10px;
}

/* dynamic line items */
.line-item{
  border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; background:var(--paper-alt);
}
.line-item-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.line-item-top span{ font-size:11px; font-weight:700; color:var(--brand-deep); text-transform:uppercase; }
.btn-del{
  background:none; border:none; color:var(--red); font-size:13px; padding:2px 6px; cursor:pointer; font-family:var(--sans);
}
.btn-add{
  width:100%; padding:10px; border:1.5px dashed var(--brand-deep); border-radius:8px; background:none;
  color: var(--brand-deep); font-weight:600; font-size:13.5px; cursor:pointer; font-family:var(--sans);
}

.subtotal-line{
  display:flex; justify-content:space-between; align-items:center; padding-top:10px; margin-top:10px;
  border-top:1.5px dashed var(--line); font-weight:700; font-size:14px; font-family:var(--mono);
}

/* denominations grid */
.denom-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:0 14px; }
.denom-row{
  display:grid; grid-template-columns: auto 54px; gap:8px; align-items:center;
  padding:6px 0; border-bottom:1px solid var(--paper-alt);
}
.denom-row label{ font-size:13px; font-family:var(--mono); color:var(--ink); margin:0; }
.denom-row input{ padding:6px; text-align:center; font-size:13.5px; }

/* cuadre summary */
.sum-line{ display:flex; justify-content:space-between; padding:6px 0; font-size:13.5px; font-family:var(--mono); }
.sum-line.total{ font-weight:700; font-size:15px; border-top:1.5px solid var(--line); margin-top:4px; padding-top:10px; }
.badge{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; font-family:var(--mono); }
.badge.ok{ background:var(--success-light); color:var(--success-dark); }
.badge.bad{ background:var(--red-light); color:var(--red); }

/* photo */
.photo-box{
  border:1.5px dashed var(--line); border-radius:8px; padding:14px; text-align:center; background:var(--paper-alt);
}
.photo-box img{ max-width:100%; border-radius:6px; margin-top:10px; display:block; }
.photo-btn{
  background: var(--brand-deep); color:#fff; border:none; padding:10px 16px; border-radius:8px;
  font-size:13.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
}
.photo-box-sm{ padding:10px; text-align:left; }
.photo-box-sm img{ max-width:140px; max-height:140px; object-fit:cover; }
.photo-btn-sm{ padding:8px 12px; font-size:12.5px; width:100%; }
.photo-required{
  margin-top:8px; font-size:11.5px; font-weight:600; color:var(--red);
  background:var(--red-light); border-radius:6px; padding:6px 8px;
}
.photo-instruction{
  font-size:12px; color:#5C4400; background:var(--brand-light); border:1px solid #E9CE7A;
  border-radius:8px; padding:8px 10px; margin-bottom:8px; font-weight:500;
}

/* bottom action bar */
.actionbar{
  position: fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; background:var(--card); border-top:1.5px solid var(--line);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex; gap:7px; z-index:30;
}
body.kb-open .actionbar{ display:none; }
body.kb-open .app{ padding-bottom:16px; }
.btn-primary{
  flex:1.3; background: var(--brand-deep); color:#fff; border:none; border-radius:10px;
  padding:12px 6px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:var(--sans);
}
.btn-primary:disabled{ opacity:.45; }
.btn-secondary{
  flex:1; background: none; border:1.5px solid var(--line); color:var(--ink); border-radius:10px;
  padding:12px 4px; font-size:12.5px; cursor:pointer; font-family:var(--sans);
}

/* empty / messages */
.empty{ text-align:center; padding: 40px 20px; color: var(--ink-soft); }
.empty i{ font-size:15px; }
.notice{
  margin:14px 16px 0; padding:10px 12px; border-radius:8px; font-size:12.5px;
  background: var(--gold-light); color:#5C4110; border:1px solid #E4CE94;
}
.toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:50;
  background: var(--brand-deep); color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px;
  font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.2); max-width:90%; text-align:center;
}

/* historial */
.hist-access-bar{
  display:flex; align-items:center; justify-content:space-between; font-size:12.5px;
  color:var(--ink-soft); margin-bottom:12px;
}
.hist-logout{
  background:none; border:1.5px solid var(--line); border-radius:6px; padding:5px 10px;
  font-size:11.5px; color:var(--ink); cursor:pointer; font-family:var(--sans);
}
.export-bar{ display:flex; gap:8px; margin-bottom:16px; }
.btn-export{
  flex:1; background:var(--card); border:1.5px solid var(--brand-deep); color:var(--brand-deep);
  border-radius:8px; padding:10px 6px; font-size:12px; font-weight:600; cursor:pointer; font-family:var(--sans);
}
.btn-danger-full{
  width:100%; background:none; border:1.5px solid var(--red); color:var(--red);
  border-radius:8px; padding:10px; font-size:12.5px; font-weight:600; cursor:pointer;
  font-family:var(--sans); margin-bottom:16px;
}
.hist-item{
  background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
}
.hist-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
.hist-date{ font-weight:700; font-size:14px; }
.hist-emp{ font-size:12px; color:var(--ink-soft); }
.hist-nums{ display:flex; justify-content:space-between; margin-top:6px; font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); }

.modal-overlay{
  position:fixed; inset:0; background:rgba(28,35,33,0.55); z-index:60;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal{
  background:var(--paper); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:18px 16px 24px;
}
.modal-close{
  width:100%; text-align:center; padding:10px; background:none; border:none; color:var(--ink-soft);
  font-size:13px; font-family:var(--sans); cursor:pointer;
}
.btn-print{
  background: none; border:1.5px solid var(--brand-deep); color:var(--brand-deep); border-radius:10px;
  padding:11px 14px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
  width:100%; margin-top:10px;
}

/* ---- Hoja imprimible / PDF ---- */
#print-area{ position:absolute; left:-99999px; top:0; width:800px; background:#fff; }
.p-sheet-wrap{ width:800px; background:#fff; }
.p-sheet{ font-family: Arial, Helvetica, sans-serif; color:#111; padding:24px; max-width:720px; margin:0 auto; background:#fff; }
.p-head{ display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #111; padding-bottom:12px; margin-bottom:16px; }
.p-head img{ height:46px; }
.p-head h1{ font-size:16px; margin:0; }
.p-head .p-date{ font-size:12px; color:#444; text-align:right; }
.p-section-title{ font-size:12px; font-weight:bold; text-transform:uppercase; letter-spacing:.5px; background:#F2F2F2; padding:5px 8px; margin:14px 0 6px; border-left:4px solid #111; }
.p-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; border-bottom:1px dotted #ccc; }
.p-row b{ font-weight:700; }
.p-line{ font-size:12px; padding:4px 0; border-bottom:1px dotted #ddd; }
.p-total{ display:flex; justify-content:space-between; font-size:13.5px; font-weight:bold; padding:6px 0 2px; border-top:1.5px solid #111; margin-top:4px; }
.p-diff{ font-size:15px; font-weight:bold; text-align:center; padding:8px; margin-top:6px; border:2px solid #111; }
.p-photo{ max-width:260px; display:block; margin-top:8px; border:1px solid #999; }
.p-sign{ display:flex; justify-content:space-between; margin-top:34px; gap:24px; }
.p-sign div{ flex:1; text-align:center; font-size:11px; }
.p-sign .p-sign-line{ border-top:1px solid #111; margin-top:36px; padding-top:4px; }

/* team tab */
.emp-row{
  display:flex; justify-content:space-between; align-items:center; background:var(--card);
  border:1.5px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px;
}
</style>
</head>

const STORAGE_PREFIX_CIERRE = 'cierre_';
const STORAGE_PREFIX_FOTO = 'cierrefoto_';

const GH_OWNER = 'direccionlanegratomasa';
const GH_REPO = 'negra-caja';
const GH_TOKEN_STORAGE_KEY = 'ngt_gh_token_v1';
function getGhToken(){ return localStorage.getItem(GH_TOKEN_STORAGE_KEY) || ''; }
function setGhToken(t){ localStorage.setItem(GH_TOKEN_STORAGE_KEY, t); }
const GH_API = 'https://api.github.com';
const GH_DIR = 'cierres';

function ghB64Encode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function ghB64Decode(str){
  return decodeURIComponent(escape(atob(str.replace(/\n/g,''))));
}

async function ghFetch(path, options={}){
  const url = `${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`;
  return fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${getGhToken()}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options.headers||{})
    }
  });
}

async function ghGetFile(path){
  const res = await ghFetch(path);
  if(res.status === 404) return null;
  if(!res.ok) throw new Error(`GitHub: no se pudo leer ${path} (${res.status})`);
  const data = await res.json();
  return { content: ghB64Decode(data.content), sha: data.sha };
}

async function ghPutFile(path, content, message){
  let res = await ghFetch(path, {
    method: 'PUT',
    body: JSON.stringify({ message: message || `guardar ${path}`, content: ghB64Encode(content) })
  });
  if(res.status === 409){
    // El archivo ya existe (por ejemplo, por un reintento o doble toque en Guardar).
    // Recuperamos su sha actual y reintentamos como actualización en vez de fallar.
    try{
      const existing = await ghGetFile(path);
      if(existing){
        res = await ghFetch(path, {
          method: 'PUT',
          body: JSON.stringify({ message: message || `actualizar ${path}`, content: ghB64Encode(content), sha: existing.sha })
        });
      }
    }catch(e){}
  }
  if(!res.ok){
    const errBody = await res.text().catch(()=>String(res.status));
    throw new Error(`GitHub: no se pudo guardar ${path} (${res.status}) ${errBody}`);
  }
  return res.json();
}

async function ghDeleteFile(path, sha){
  const res = await ghFetch(path, {
    method: 'DELETE',
    body: JSON.stringify({ message: `borrar ${path}`, sha })
  });
  if(!res.ok) throw new Error(`GitHub: no se pudo borrar ${path} (${res.status})`);
}

async function ghListDir(dir){
  const res = await ghFetch(dir);
  if(res.status === 404) return [];
  if(!res.ok) throw new Error(`GitHub: no se pudo listar ${dir} (${res.status})`);
  return res.json();
}

function emptyForm(){
  return {
    fecha: new Date().toISOString().slice(0,10),
    empleado: '',
    turno: '',
    fondoInicial: 0,
    tarjeta: 0,
    efectivoSistema: 0,
    delivery: 0,
    retiros: [],
    cortesias: [],
    gastos: [],
    denom: {},
    observaciones: '',
    fotoDataUrl: '',
    firmaEmpleado: ''
  };
}

function money(n){
  n = Number(n)||0;
  return n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}

function contadoEntregarOf(e){
  if(e.contadoEntregar !== undefined) return e.contadoEntregar;
  // compatibilidad con cierres guardados antes de este ajuste
  return (Number(e.totalContado)||0) - (Number(e.fondoInicial)||0);
}

function calc(form){
  const tarjeta = Number(form.tarjeta)||0;
  const efSistema = Number(form.efectivoSistema)||0;
  const delivery = Number(form.delivery)||0;
  const fondo = Number(form.fondoInicial)||0;
  const totalVentas = tarjeta + efSistema + delivery;
  const totalRetiros = form.retiros.reduce((s,x)=>s+(Number(x.monto)||0),0);
  const totalCortesias = form.cortesias.reduce((s,x)=>s+(Number(x.monto)||0),0);
  const totalGastos = form.gastos.reduce((s,x)=>s+(Number(x.monto)||0),0);
  let totalContado = 0;
  [...BILLETES, ...MONEDAS].forEach(d=>{
    const q = Number(form.denom[d])||0;
    totalContado += q*d;
  });
  // El fondo inicial se queda en caja para el día siguiente: no se entrega,
  // así que se descuenta tanto de lo esperado como de lo contado antes de comparar.
  // El delivery no pasa por la caja física (se cobra aparte, por app/plataforma),
  // así que no forma parte del efectivo esperado ni del cuadre.
  const esperado = efSistema - totalRetiros - totalGastos;
  const contadoEntregar = totalContado - fondo;
  const diferencia = contadoEntregar - esperado;
  return { tarjeta, efSistema, delivery, fondo, totalVentas, totalRetiros, totalCortesias, totalGastos, totalContado, contadoEntregar, esperado, diferencia };
}

async function loadHistorial(){
  try{
    const items = await ghListDir(GH_DIR);
    const jsonFiles = items.filter(it => it.type === 'file' && it.name.endsWith('.json'));
    const entries = [];
    for(const f of jsonFiles){
      try{
        const file = await ghGetFile(f.path);
        if(file) entries.push({ ...JSON.parse(file.content), __ghPath: f.path, __ghSha: f.sha });
      }catch(e){}
    }
    entries.sort((a,b)=> (b.savedAt||0) - (a.savedAt||0));
    state.historial = entries;
  }catch(e){ state.historial = []; }
}

async function ensureEntryPhotos(e){
  if(e.__photosLoaded) return e;
  try{
    if(e.fotoKey && !e.fotoDataUrl){
      try{
        const file = await ghGetFile(e.fotoKey);
        if(file) e.fotoDataUrl = file.content;
      }catch(err){}
    }
    if(e.gastos && e.gastos.length){
      for(const g of e.gastos){
        if(g.fotoKey && !g.foto){
          try{
            const file = await ghGetFile(g.fotoKey);
            if(file) g.foto = file.content;
          }catch(err){}
        }
      }
    }
  }catch(err){}
  e.__photosLoaded = true;
  return e;
}

async function init(){
  if(!getGhToken()){
    renderSetupGate();
    return;
  }
  await loadHistorial();
  state.loading = false;
  render();
  setupKeyboardHandling();
}

        <img class="brand-icon" src="data:image/png;base64,${LOGO_ICON_B64}" alt="La Negra Tomasa de Sol">
        <img class="brand-word" src="data:image/png;base64,${LOGO_WORD_B64}" alt="La Negra Tomasa de Sol">
      </div>
      <p class="topbar-sub" style="margin-top:8px">Configuración inicial de este teléfono</p>
    </div>
    <div class="wrap">
      <div class="card">
        <div class="card-head"><span class="card-num">i</span>Código de acceso</div>
        <div class="card-body">
          <div class="notice" style="margin:0 0 12px">Esto solo se pide una vez en cada teléfono. Pide el código al encargado si no lo tienes.</div>
          ${msg ? `<div class="photo-required" style="margin-bottom:12px">${esc(msg)}</div>` : ''}
          <div class="field">
            <label>Código de acceso</label>
            <input type="text" id="setup-input" placeholder="Pega aquí el código" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
          </div>
          <button class="btn-print" id="setup-btn" type="button" style="margin-top:6px">Continuar</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('setup-btn').onclick = async ()=>{
    const val = document.getElementById('setup-input').value.trim();
    if(!val){ return; }
    const btn = document.getElementById('setup-btn');
    btn.textContent = 'Comprobando...';
    try{
      const res = await fetch(`${GH_API}/repos/${GH_OWNER}/${GH_REPO}`, {
        headers: { 'Authorization': `Bearer ${val}`, 'Accept': 'application/vnd.github+json' }
      });
      if(!res.ok){
        renderSetupGate(`El código no fue aceptado (código de error ${res.status}). Revisa que lo copiaste completo, sin espacios de más ni de menos.`);
        return;
      }
      setGhToken(val);
      init();
    }catch(err){
      const detalle = (err && err.message) ? err.message : String(err);
      renderSetupGate(`No se pudo comprobar el código: ${detalle}. Revisa tu conexión a internet e inténtalo de nuevo.`);
    }
  };
}

function setupKeyboardHandling(){
  if(window.visualViewport){
    const vv = window.visualViewport;
    const update = ()=>{
      const keyboardOpen = vv.height < window.innerHeight - 120;
      document.body.classList.toggle('kb-open', keyboardOpen);
    };
    vv.addEventListener('resize', update);
    vv.addEventListener('scroll', update);
  }
  document.addEventListener('focusin', (e)=>{
    const t = e.target;
    if(t.matches && t.matches('input, select, textarea')){
      setTimeout(()=>{ t.scrollIntoView({block:'center', behavior:'smooth'}); }, 320);
    }
  });
}

function showToast(msg){
  state.toastMsg = msg;
  render();
  setTimeout(()=>{ state.toastMsg = null; render(); }, 2200);
}

/* ---------------- RENDER ---------------- */

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const top = document.createElement('div');
  top.className = 'topbar';
  top.innerHTML = `
    <div class="brand-row">
      <img class="brand-icon" src="data:image/png;base64,${LOGO_ICON_B64}" alt="La Negra Tomasa de Sol">
      <img class="brand-word" src="data:image/png;base64,${LOGO_WORD_B64}" alt="La Negra Tomasa de Sol">
    </div>
    <p class="topbar-sub" style="margin-top:8px">Cierre de caja · ${state.tab==='nuevo' ? new Date().toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'}) : ' '}</p>
    <div class="tabs">
      <div class="tab ${state.tab==='nuevo'?'active':''}" data-tab="nuevo">Nuevo cierre</div>
      <div class="tab ${state.tab==='historial'?'active':''}" data-tab="historial">Historial</div>
    </div>
  `;

  const stickyHead = document.createElement('div');
  stickyHead.className = 'sticky-head';
  stickyHead.appendChild(top);

  if(state.tab === 'nuevo' && !state.loading){
    const c = calc(state.form);
    const tape = document.createElement('div');
    tape.id = 'tape';
    tape.className = 'tape ' + (Math.abs(c.diferencia) < 0.005 ? 'diff-ok' : 'diff-bad');
    tape.innerHTML = `<span class="lbl">Diferencia de caja</span><span class="val" id="tape-diff-val">${c.diferencia>0?'+':''}${money(c.diferencia)}</span>`;
    stickyHead.appendChild(tape);
  }

  app.appendChild(stickyHead);

  if(state.loading){
    const l = document.createElement('div');
    l.className = 'empty';
    l.textContent = 'Cargando...';
    app.appendChild(l);
    attachTabHandlers();
    return;
  }

  if(state.tab === 'nuevo') renderNuevo(app);
  if(state.tab === 'historial') renderHistorial(app);

  if(state.modalEntry) renderModal(app);
  if(state.confirmModal) renderConfirmModal(app);
  if(state.toastMsg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = state.toastMsg;
    app.appendChild(t);
  }

  attachTabHandlers();
}

function attachTabHandlers(){
  document.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ state.tab = el.dataset.tab; render(); };
  });
}

function selectOptions(list, current, placeholder){
  let html = `<option value="">${placeholder}</option>`;
  list.forEach(v=>{
    html += `<option value="${esc(v)}" ${current===v?'selected':''}>${esc(v)}</option>`;
  });
  return html;
}

function fieldInputHtml(kind, idx, field, item){
  const val = item[field.key] || '';
  if(field.type === 'select'){
    return `<select data-kind="${kind}" data-idx="${idx}" data-field="${field.key}">${selectOptions(field.options, val, 'Selecciona')}</select>`;
  }
  if(field.type === 'photo'){
    const inputId = `photo-${kind}-${idx}-${field.key}`;
    return `
      <div class="photo-box photo-box-sm">
        ${val ? `<img src="${val}">` : ''}
        <div style="margin-top:${val?'8px':'0'}">
          <input type="file" accept="image/*" capture="environment" id="${inputId}" style="display:none" data-kind="${kind}" data-idx="${idx}" data-field="${field.key}">
          <button type="button" class="photo-btn photo-btn-sm" data-target="${inputId}">${val ? 'Cambiar foto' : 'Tomar / subir foto'}</button>
        </div>
        ${(field.required && !val) ? '<div class="photo-required">Obligatoria: falta la foto del ticket/factura</div>' : ''}
      </div>
    `;
  }
  return `<input type="text" data-kind="${kind}" data-idx="${idx}" data-field="${field.key}" value="${esc(val)}">`;
}

function compressImageFile(file, maxW, quality, callback){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function renderLineSection(containerId, items, kind, fieldsConfig, addLabel, total){
  const el = byId(containerId);
  if(!el) return;
  el.innerHTML = items.map((item,idx)=>`
    <div class="line-item">
      <div class="line-item-top">
        <span>${kind.slice(0,-1)} ${idx+1}</span>
        <button class="btn-del" data-kind="${kind}" data-idx="${idx}" type="button">Eliminar</button>
      </div>
      <div class="amount-row">
        <div class="field" style="margin-bottom:0"><label>Monto</label><input type="number" inputmode="decimal" data-kind="${kind}" data-idx="${idx}" data-field="monto" value="${item.monto ?? 0}" placeholder="0.00" onfocus="this.select()"></div>
      </div>
      ${fieldsConfig.map((field,fi)=>`
        <div class="field" style="margin-bottom:${fi===fieldsConfig.length-1?'0':'12px'}"><label>${field.label}</label>${fieldInputHtml(kind, idx, field, item)}</div>
      `).join('')}
    </div>
  `).join('') + `<button class="btn-add" data-kind="${kind}" type="button">+ ${addLabel}</button>` +
  `<div class="subtotal-line"><span>Total</span><span id="total-${kind}-val">${money(total)}</span></div>`;

  el.querySelectorAll('input, select').forEach(inp=>{
    if(inp.type === 'file') return;
    const handler = e=>{
      const {kind, idx, field} = e.target.dataset;
      state.form[kind][idx][field] = e.target.value;
      if(field === 'monto') refreshCalc();
    };
    if(inp.tagName === 'SELECT'){ inp.onchange = handler; }
    else { inp.oninput = handler; }
  });
  el.querySelectorAll('input[type=file]').forEach(inp=>{
    inp.onchange = e=>{
      const file = e.target.files[0];
      if(!file) return;
      const {kind, idx, field} = e.target.dataset;
      compressImageFile(file, 900, 0.6, dataUrl=>{
        state.form[kind][idx][field] = dataUrl;
        render();
      });
    };
  });
  el.querySelectorAll('.photo-btn-sm').forEach(btn=>{
    btn.onclick = ()=> byId(btn.dataset.target).click();
  });
  el.querySelectorAll('.btn-del').forEach(btn=>{
    btn.onclick = ()=>{
      const {kind, idx} = btn.dataset;
      state.form[kind].splice(idx,1);
      render();
    };
  });
  const addBtn = el.querySelector('.btn-add');
  if(addBtn){
    addBtn.onclick = ()=>{
      const blank = {monto:0};
      fieldsConfig.forEach(fc=> blank[fc.key] = '');
      state.form[kind].push(blank);
      render();
    };
  }
}

async function handleGuardar(){
  if(state.saving) return;
  const f = state.form;
  if(!f.empleado){ showNotice('Falta información', 'Selecciona el empleado que realiza el cierre.'); return; }
  if(!f.firmaEmpleado){ showNotice('Falta información', 'Selecciona quién entrega el efectivo para confirmar.'); return; }
  if(!f.fotoDataUrl){
    showNotice('Falta la foto del efectivo', 'Debes tomar la foto de todo el efectivo contado (billetes con el número de serie hacia arriba) antes de guardar el cierre.');
    return;
  }
  const c = calc(f);
  if(Math.abs(c.diferencia) >= 0.005){
    openConfirm({
      title: 'Hay una diferencia de caja',
      message: `La diferencia es de ${c.diferencia>0?'+':''}${money(c.diferencia)}. Puedes guardar el cierre igualmente — es algo que puede pasar. Procura anotar el motivo en Observaciones antes de guardar. ¿Guardar así?`,
      confirmLabel: 'Guardar igual',
      cancelLabel: 'Revisar antes',
      danger: true,
      onConfirm: ()=> guardarCierreDefinitivo(f, c)
    });
    return;
  }
  await guardarCierreDefinitivo(f, c);
}

async function guardarCierreDefinitivo(f, c){
  if(state.saving) return;
  state.saving = true;
  const btn = byId('btn-guardar');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando...'; }
  const uniqueId = f.fecha + '_' + slug(f.empleado) + '_' + Date.now();
  const entry = { ...f, ...c, savedAt: Date.now() };

  // Las fotos se guardan en archivos propios (no dentro del registro principal)
  // para no toparse con el límite de tamaño por archivo cuando hay varias fotos.
  const photoJobs = [];
  if(entry.fotoDataUrl){
    const fotoPath = `${GH_DIR}/${uniqueId}_efectivo.txt`;
    photoJobs.push({ path: fotoPath, dataUrl: entry.fotoDataUrl });
    entry.fotoKey = fotoPath;
  }
  delete entry.fotoDataUrl;

  entry.gastos = entry.gastos.map((g, idx)=>{
    if(g.foto){
      const fotoPath = `${GH_DIR}/${uniqueId}_gasto${idx}.txt`;
      photoJobs.push({ path: fotoPath, dataUrl: g.foto });
      const { foto, ...rest } = g;
      return { ...rest, fotoKey: fotoPath };
    }
    return g;
  });

  try{
    for(const job of photoJobs){
      await ghPutFile(job.path, job.dataUrl, `foto de cierre ${uniqueId}`);
    }
    await ghPutFile(`${GH_DIR}/${uniqueId}.json`, JSON.stringify(entry), `cierre ${uniqueId}`);
    showToast('Cierre guardado correctamente');
    state.form = emptyForm();
    await loadHistorial();
    state.tab = 'historial';
    render();
  }catch(err){
    const detalle = (err && err.message) ? err.message : String(err);
    showNotice(
      'No se pudo guardar el cierre',
      `Motivo: ${detalle}. Comprueba tu conexión a internet e inténtalo de nuevo. Si el problema continúa, prueba a quitar alguna foto y volver a tomarla (puede que el cierre tenga demasiadas fotos o alguna muy pesada).`
    );
  }finally{
    state.saving = false;
  }
}

/* ---------- HISTORIAL ---------- */

function renderHistorial(app){
  if(!state.historialUnlocked){
    renderHistorialGate(app);
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'wrap';
  wrap.innerHTML = `<div class="hist-access-bar">Viendo como <b>${esc(state.historialUser)}</b> · <button class="hist-logout" id="btn-hist-logout" type="button">Salir</button></div>`;
  wrap.innerHTML += `
    <div class="export-bar">
      <button class="btn-export" id="btn-export-csv" type="button">Exportar a Excel (CSV)</button>
      <button class="btn-export" id="btn-export-pdf" type="button">Imprimir / PDF todos</button>
    </div>
  `;
  if(state.historial.length > 0){
    wrap.innerHTML += `<button class="btn-danger-full" id="btn-borrar-todo" type="button">Borrar todo el historial</button>`;
  }
  if(state.historial.length === 0){
    wrap.innerHTML += `<div class="empty">Todavía no hay cierres guardados.<br>Los cierres que registren los empleados aparecerán aquí.</div>`;
  }else{
    wrap.innerHTML += state.historial.map((e,idx)=>`
      <div class="hist-item" data-idx="${idx}">
        <div class="hist-top">
          <span class="hist-date">${formatFecha(e.fecha)}</span>

        </div>
        <div class="hist-emp">${esc(e.empleado||'—')} · ${esc(e.turno||'sin turno')}</div>

          <span>Contado ${money(e.totalContado)}</span>
        </div>
      </div>
    `).join('');
  }
  app.appendChild(wrap);
  wrap.querySelectorAll('.hist-item').forEach(el=>{
    el.onclick = async ()=>{
      const entry = state.historial[el.dataset.idx];
      if(entry.fotoKey || (entry.gastos||[]).some(g=>g.fotoKey)) showToast('Cargando fotos...');
      await ensureEntryPhotos(entry);
      state.modalEntry = entry;
      render();
    };
  });
  byId('btn-export-csv').onclick = exportHistorialCSV;
  byId('btn-export-pdf').onclick = printAllHistorial;
  const btnBorrarTodo = byId('btn-borrar-todo');
  if(btnBorrarTodo) btnBorrarTodo.onclick = borrarTodoHistorial;
  byId('btn-hist-logout').onclick = ()=>{
    state.historialUnlocked = false;
    state.historialUser = '';
    render();
  };
}

function renderHistorialGate(app){
  const wrap = document.createElement('div');
  wrap.className = 'wrap';
  wrap.innerHTML = `
    <div class="card">
      <div class="card-head"><span class="card-num">i</span>Acceso restringido</div>
      <div class="card-body">
        <div class="notice" style="margin:0 0 12px">El historial de cierres solo puede verlo Jorge, Carlos, Maxi, Laura o Ruth. Selecciona tu nombre e introduce la contraseña para continuar.</div>
        <div class="field">
          <label>¿Quién eres?</label>
          <select id="gate-select">${selectOptions(HISTORIAL_AUTORIZADOS, '', 'Selecciona tu nombre')}</select>
        </div>
        <div class="field" style="margin-bottom:0">
          <label>Contraseña</label>
          <input type="password" id="gate-pass" inputmode="numeric" placeholder="Contraseña de acceso">
        </div>
        <button class="btn-print" id="gate-btn" type="button" style="margin-top:12px">Ver historial</button>
      </div>
    </div>
  `;
  app.appendChild(wrap);
  const tryUnlock = ()=>{
    const val = byId('gate-select').value;
    const pass = byId('gate-pass').value;
    if(!val){ showNotice('Falta información', 'Selecciona tu nombre para entrar al historial.'); return; }

    state.historialUnlocked = true;
    state.historialUser = val;
    render();
  };
  byId('gate-btn').onclick = tryUnlock;
  byId('gate-pass').onkeydown = e=>{ if(e.key === 'Enter') tryUnlock(); };
}

async function generatePdfFromContainer(filename){
  if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
    showNotice('No disponible', 'No se pudo cargar el generador de PDF (revisa tu conexión a internet) e inténtalo de nuevo.');
    return false;
  }
  const container = byId('print-area');
  const sheets = Array.from(container.children);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'pt', format:'a4' });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();

  for(let i=0; i<sheets.length; i++){
    const canvas = await html2canvas(sheets[i], { scale:2, useCORS:true, backgroundColor:'#ffffff' });
    const imgData = canvas.toDataURL('image/jpeg', 0.85);
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    let heightLeft = imgHeight;
    let position = 0;
    if(i > 0) pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
  }
  pdf.save(filename);
  return true;
}

async function printEntry(e){

  const filename = `cierre_${e.fecha}_${slug(e.empleado||'sin-nombre')}.pdf`;
  const ok = await generatePdfFromContainer(filename);
  area.innerHTML = '';
  if(ok) showDownloadNotice(filename);
}

function showDownloadNotice(filename){
  showNotice(
    'Archivo descargado',
    `Se descargó "${filename}". En iPhone: abre la app Archivos > Descargas (o el icono de flecha hacia abajo junto a la barra de direcciones de Safari). En Android: abre Archivos o Mis archivos > Download, o desliza las notificaciones y toca la descarga reciente.`
  );
}

function csvEscape(val){
  const s = String(val ?? '');
  if(/[;"\n]/.test(s)){ return '"' + s.replace(/"/g,'""') + '"'; }
  return s;
}

function csvNum(n){ return (Number(n)||0).toFixed(2).replace('.', ','); }

function exportHistorialCSV(){
  if(state.historial.length === 0){ showNotice('Sin datos', 'No hay cierres guardados para exportar.'); return; }
  const headers = ['Fecha','Empleado','Turno','Fondo inicial','Tarjeta','Efectivo sistema','Delivery','Total ventas','Total retiros','Total cortesías','Total gastos','Efectivo esperado','Efectivo contado','Diferencia','Entregado por','Observaciones'];
  const ordered = state.historial.slice().sort((a,b)=> (a.savedAt||0) - (b.savedAt||0));
  const rows = ordered.map(e=>[
    formatFecha(e.fecha), e.empleado||'', e.turno||'',
    csvNum(e.fondoInicial), csvNum(e.tarjeta), csvNum(e.efSistema), csvNum(e.delivery),
    csvNum(e.totalVentas), csvNum(e.totalRetiros), csvNum(e.totalCortesias), csvNum(e.totalGastos),
    csvNum(e.esperado), csvNum(contadoEntregarOf(e)), csvNum(e.diferencia),
    e.firmaEmpleado||'', (e.observaciones||'').replace(/[\r\n]+/g,' ')
  ]);
  const csvContent = [headers, ...rows].map(r => r.map(csvEscape).join(';')).join('\r\n');
  const filename = `historial_cierres_${new Date().toISOString().slice(0,10)}.csv`;
  downloadBlob('\uFEFF' + csvContent, filename, 'text/csv;charset=utf-8;');
  showDownloadNotice(filename);
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1500);
}

function borrarTodoHistorial(){
  if(state.historial.length === 0) return;
  const total = state.historial.length;
  openConfirm({
    title: 'Borrar todo el historial',
    message: `Vas a borrar PERMANENTEMENTE los ${total} cierres guardados (incluyendo fotos y detalles). Esta acción no se puede deshacer.`,
    confirmLabel: 'Sí, continuar',
    danger: true,
    onConfirm: ()=>{
      openConfirm({
        title: 'Confirmación final',
        message: 'Se borrará todo el historial para todos los usuarios que usan esta app. ¿Borrar ahora?',
        confirmLabel: 'Borrar definitivamente',
        danger: true,
        onConfirm: ejecutarBorradoHistorial
      });
    }
  });
}

async function ejecutarBorradoHistorial(){
  try{
    const items = await ghListDir(GH_DIR);
    for(const it of items){
      if(it.type !== 'file') continue;
      try{ await ghDeleteFile(it.path, it.sha); }catch(e){}
    }
    await loadHistorial();
    showToast('Historial borrado');
    render();
  }catch(err){
    showNotice('Error', 'No se pudo borrar el historial. Inténtalo de nuevo.');
  }
}

function byId(id){ return document.getElementById(id); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function slug(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'); }
function formatFecha(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
