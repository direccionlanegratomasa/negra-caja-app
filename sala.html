<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Control de Sala</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F6F4EE;
  --paper-alt:#EDEAE0;
  --card:#FFFFFF;
  --ink:#1C2321;
  --ink-soft:#6B756F;
  --line:#D8D3C6;
  --brand:#FFD400;
  --brand-light:#FFF6D0;
  --brand-deep:#9C6F00;
  --red:#B23A2E;
  --red-light:#F6DEDA;
  --radius:12px;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  --sans:'Space Grotesk', system-ui, -apple-system, sans-serif;

  /* colores funcionales por fase de la mesa */
  --f-libre:#EDEAE0;
  --f-libre-ink:#8A8577;
  --f-ocupada:#F3D9A0;
  --f-ocupada-ink:#7A5A12;
  --f-atendida:#BFD9E8;
  --f-atendida-ink:#1E4E66;
  --f-primeros:#CBD9A8;
  --f-primeros-ink:#3E5620;
  --f-segundos:#9FC6A0;
  --f-segundos-ink:#25482A;
  --f-postres:#CBB8DE;
  --f-postres-ink:#4A2E63;
  --f-cobrada:#C9C4B6;
  --f-cobrada-ink:#4B473C;
  --f-alerta:#E4796B;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body{ margin:0; }

.app{
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper);
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 30px;
}

.topbar{
  position: sticky; top:0; z-index:20;
  background: var(--brand);
  color:#2B2107;
  padding: 14px 16px 12px;
}
.brand-row{ display:flex; align-items:center; gap:10px; }
.brand-icon{ height:40px; width:auto; }
.brand-word{ height:30px; width:auto; }
.topbar-sub{ font-size:11px; color:#6B5100; font-family:var(--mono); margin:8px 0 0; }
.tabs{ display:flex; gap:6px; margin-top:12px; }
.tab{
  flex:1; text-align:center; padding:9px 4px; border-radius:8px;
  font-size:12.5px; font-weight:500; color:#5C4400; background:transparent;
  border:1px solid rgba(43,33,7,0.25); cursor:pointer;
}
.tab.active{ background:#2B2107; color:#FDF1CE; border-color:#2B2107; font-weight:700; }

.wrap{ padding: 16px; }

.notice{
  margin:0 0 14px; padding:10px 12px; border-radius:8px; font-size:12.5px;
  background: var(--brand-light); color:#5C4400; border:1px solid #E9CE7A;
}
.hint{ font-size:11.5px; color: var(--ink-soft); }

/* leyenda de fases */
.legend{ display:flex; flex-wrap:wrap; gap:6px 12px; margin-bottom:14px; }
.legend-item{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); }
.legend-dot{ width:10px; height:10px; border-radius:3px; display:inline-block; }

/* plano de sala */
.floor{
  position:relative; width:100%; aspect-ratio: 3/4; background:var(--card);
  border:1.5px dashed var(--line); border-radius:var(--radius); overflow:hidden;
  touch-action:none;
}
.floor.edit-mode{ background:
  repeating-linear-gradient(0deg, transparent, transparent 24px, rgba(0,0,0,.035) 24px, rgba(0,0,0,.035) 25px),
  repeating-linear-gradient(90deg, transparent, transparent 24px, rgba(0,0,0,.035) 24px, rgba(0,0,0,.035) 25px);
}
.mesa{
  position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:10px; border:2px solid rgba(0,0,0,.15); cursor:pointer;
  font-family:var(--mono); user-select:none; transition:box-shadow .15s;
}
.mesa.alerta{ animation: pulse-alerta 1.6s infinite; }
@keyframes pulse-alerta{
  0%,100%{ box-shadow: 0 0 0 0 rgba(178,58,46,0.45); }
  50%{ box-shadow: 0 0 0 6px rgba(178,58,46,0); }
}
.mesa.round{ border-radius:50%; }
.mesa-num{ font-size:15px; font-weight:700; }
.mesa-time{ font-size:9.5px; opacity:.85; margin-top:1px; }
.mesa.dragging{ opacity:.85; z-index:30; }

.btn-edit-toggle{
  width:100%; padding:11px; border-radius:10px; border:1.5px solid var(--brand-deep);
  background:none; color:var(--brand-deep); font-weight:600; font-size:13.5px; cursor:pointer;
  font-family:var(--sans); margin-top:12px;
}
.btn-edit-toggle.active{ background:var(--brand-deep); color:#fff; }
.edit-row{ display:flex; gap:8px; margin-top:10px; }
.edit-row button{
  flex:1; padding:10px; border-radius:8px; border:1.5px solid var(--line); background:#fff;
  font-family:var(--sans); font-size:12.5px; cursor:pointer;
}

/* modal detalle de mesa */
.modal-overlay{
  position:fixed; inset:0; background:rgba(28,35,33,0.55); z-index:60;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal{
  background:var(--paper); width:100%; max-width:720px; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:18px 16px 24px;
}
.modal-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
.modal-head h2{ margin:0; font-size:20px; }
.modal-close-x{ background:none; border:none; font-size:22px; color:var(--ink-soft); cursor:pointer; line-height:1; }

.fase-badge{
  display:inline-block; padding:5px 12px; border-radius:20px; font-size:12.5px; font-weight:700;
  font-family:var(--mono); margin-bottom:16px;
}

.timeline{ margin-bottom:16px; }
.timeline-row{
  display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--paper-alt);
  font-size:13px;
}
.timeline-row .lbl{ color:var(--ink-soft); }
.timeline-row .val{ font-family:var(--mono); font-weight:600; }

.btn-avanzar{
  width:100%; padding:14px; border-radius:10px; border:none; background:var(--brand-deep);
  color:#fff; font-weight:700; font-size:15px; cursor:pointer; font-family:var(--sans); margin-bottom:10px;
}
.btn-secundario2{
  width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--line); background:none;
  color:var(--ink); font-size:13.5px; cursor:pointer; font-family:var(--sans); margin-bottom:8px;
}
.btn-liberar{
  width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--red); background:none;
  color:var(--red); font-size:13.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
}

.field{ margin-bottom:12px; }
.field label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; }
input[type=text], input[type=number], select{
  width:100%; border:1.5px solid var(--line); border-radius:8px; padding:10px 11px;
  font-family: var(--sans); font-size:15px; color: var(--ink); background:#FCFBF8;
}
select{
  appearance:none; -webkit-appearance:none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236B756F' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
  background-repeat:no-repeat; background-position: right 10px center; padding-right:34px;
}

.card{
  background: var(--card); border:1.5px dashed var(--line); border-radius:var(--radius);
  margin-bottom:16px; overflow:hidden; position:relative;
}
.card::before, .card::after{
  content:""; position:absolute; width:14px; height:14px; border-radius:50%; background:var(--paper); top:-7px;
}
.card::before{ left:-7px; }
.card::after{ right:-7px; }
.card-head{
  background: var(--brand-light); color: var(--brand-deep); padding:10px 14px;
  font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
}
.card-body{ padding:14px; }

.photo-required{
  margin-top:8px; font-size:11.5px; font-weight:600; color:var(--red);
  background:var(--red-light); border-radius:6px; padding:6px 8px;
}
.toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:70;
  background: var(--brand-deep); color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px;
  font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.2); max-width:90%; text-align:center;
}
.btn-print{
  background: none; border:1.5px solid var(--brand-deep); color:var(--brand-deep); border-radius:10px;
  padding:11px 14px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
  width:100%; margin-top:10px;
}
.btn-secondary{
  background: none; border:1.5px solid var(--line); color:var(--ink); border-radius:10px;
  padding:12px 4px; font-size:12.5px; cursor:pointer; font-family:var(--sans); width:100%;
}
.empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
</style>
</head>

const SESSION_STORAGE_KEY = 'ngt_session_v1';
function getSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || 'null'); }
  catch(e){ return null; }
}
function setSession(s){ localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem(SESSION_STORAGE_KEY); }

function ghB64Encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function ghB64Decode(str){ return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))); }

async function ghFetch(path, options={}){
  const url = `${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`;
  return fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${GH_TOKEN}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options.headers||{})
    }
  });
}

async function ghGetFile(path){
  const res = await ghFetch(path);
  if(res.status === 404) return null;
  if(!res.ok) throw new Error(`GitHub: no se pudo leer ${path} (${res.status})`);
  const data = await res.json();
  return { content: ghB64Decode(data.content), sha: data.sha };
}

async function ghPutFile(path, content, message){
  let res = await ghFetch(path, {
    method:'PUT',
    body: JSON.stringify({ message: message || `guardar ${path}`, content: ghB64Encode(content) })
  });
  if(res.status === 409 || res.status === 422){
    try{
      const existing = await ghGetFile(path);
      if(existing){
        res = await ghFetch(path, {
          method:'PUT',
          body: JSON.stringify({ message: message || `actualizar ${path}`, content: ghB64Encode(content), sha: existing.sha })
        });
      }
    }catch(e){}
  }
  if(!res.ok){
    const errBody = await res.text().catch(()=>String(res.status));
    throw new Error(`GitHub: no se pudo guardar ${path} (${res.status}) ${errBody}`);
  }
  return res.json();
}

/* -------- utilidades -------- */
function byId(id){ return document.getElementById(id); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function nowISO(){ return new Date().toISOString(); }
function fmtHora(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}
function minutosDesde(iso){
  if(!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime())/60000);
}
function fmtMinutos(m){
  if(m===null || m===undefined) return '—';
  if(m < 1) return '<1 min';
  if(m < 60) return `${m} min`;
  const h = Math.floor(m/60), r = m%60;
  return `${h}h ${r}min`;
}

function selectOptions(list, current, placeholder){
  let html = `<option value="">${placeholder}</option>`;
  list.forEach(v=>{
    html += `<option value="${esc(v)}" ${current===v?'selected':''}>${esc(v)}</option>`;
  });
  return html;
}

function showToast(msg){
  state.toastMsg = msg;
  render();
  setTimeout(()=>{ state.toastMsg = null; render(); }, 2200);
}

function openConfirm(opts){
  state.confirmModal = Object.assign({
    title:'Confirmar', message:'', confirmLabel:'Confirmar', cancelLabel:'Cancelar', danger:false, hideCancel:false, onConfirm:null
  }, opts);
  render();
}
function closeConfirm(){ state.confirmModal = null; render(); }
function showNotice(title, message){ openConfirm({ title, message, confirmLabel:'Entendido', hideCancel:true }); }

/* -------- carga de datos -------- */

async function fetchEmpleados(){
  const file = await ghGetFile(GH_EMPLEADOS_PATH);
  if(!file) return [];
  try{ return JSON.parse(file.content); }catch(e){ return []; }
}
async function fetchLayout(){
  const file = await ghGetFile(GH_LAYOUT_PATH);
  if(!file) return [];
  try{ return JSON.parse(file.content); }catch(e){ return []; }
}
async function fetchEstado(){
  const file = await ghGetFile(GH_ESTADO_PATH);
  if(!file) return {};
  try{ return JSON.parse(file.content); }catch(e){ return {}; }
}

async function cargarTodo(){
  const [layout, estado] = await Promise.all([fetchLayout(), fetchEstado()]);
  state.layout = layout;
  state.estado = estado;
}

async function guardarLayout(nuevoLayout){
  await ghPutFile(GH_LAYOUT_PATH, JSON.stringify(nuevoLayout, null, 2), 'Actualizar plano de sala');
  state.layout = nuevoLayout;
}

// Actualiza una mesa de forma seria frente a escrituras concurrentes de
// otros camareros: relee el estado completo, fusiona solo esta mesa, y
// reintenta si otro camarero escribió justo antes.
async function actualizarMesaSegura(mesaId, cambios, intentos=4){
  for(let i=0;i<intentos;i++){
    const file = await ghGetFile(GH_ESTADO_PATH);
    const estado = file ? JSON.parse(file.content) : {};
    estado[mesaId] = { ...(estado[mesaId]||{}), ...cambios };
    const res = await ghFetch(GH_ESTADO_PATH, {
      method:'PUT',
      body: JSON.stringify({
        message: `Actualizar mesa ${mesaId}`,
        content: ghB64Encode(JSON.stringify(estado, null, 2)),
        ...(file ? {sha:file.sha} : {})
      })
    });
    if(res.ok){ state.estado = estado; return true; }
    if(res.status === 409 || res.status === 422){ continue; }
    const errBody = await res.text().catch(()=>String(res.status));
    throw new Error(`No se pudo actualizar la mesa (${res.status}) ${errBody}`);
  }
  throw new Error('No se pudo actualizar tras varios intentos (mucha gente editando a la vez). Prueba de nuevo.');
}

/* -------- arranque -------- */

async function init(){
  const session = getSession();
  if(!session || !session.nombre || !session.codigo){
    await renderSetupGate();
    return;
  }
  try{
    const empleados = await fetchEmpleados();
    const valido = empleados.some(e => e.nombre === session.nombre && String(e.codigo) === String(session.codigo));
    if(!valido){
      clearSession();
      await renderSetupGate('Tu código de acceso ya no es válido. Pide un código nuevo al encargado.');
      return;
    }
    state.empleados = empleados;
  }catch(err){ /* seguimos con sesión ya validada antes */ }

  await cargarTodo();
  state.loading = false;
  render();
  iniciarActualizacionPeriodica();
}

function iniciarActualizacionPeriodica(){
  setInterval(async ()=>{
    if(state.editMode || state.confirmModal) return;
    try{
      await cargarTodo();
      render();
    }catch(e){}
  }, 20000);
  // refresco del reloj (minutos transcurridos) cada 30s sin llamar a GitHub
  setInterval(()=>{
    if(!state.editMode && !state.confirmModal) render();
  }, 30000);
}

async function renderSetupGate(msg){
  const app = byId('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="brand-row">
        <img class="brand-icon" src="data:image/png;base64,${LOGO_ICON_B64}" alt="La Negra Tomasa de Sol">
        <img class="brand-word" src="data:image/png;base64,${LOGO_WORD_B64}" alt="La Negra Tomasa de Sol">
      </div>
      <p class="topbar-sub">Control de sala · identifícate en este teléfono</p>
    </div>
    <div class="wrap">
      <div class="card">
        <div class="card-head">Identifícate</div>
        <div class="card-body">
          <div class="notice" style="margin:0 0 12px">Es el mismo nombre y código que usas en la app de cierre de caja.</div>
          ${msg ? `<div class="photo-required" style="margin-bottom:12px">${esc(msg)}</div>` : '<div id="setup-loading" class="hint">Cargando lista de empleados...</div>'}
          <div id="setup-form" style="display:none">
            <div class="field"><label>Tu nombre</label><select id="setup-nombre"></select></div>
            <div class="field" style="margin-bottom:0">
              <label>Tu código personal</label>
              <input type="text" id="setup-codigo" inputmode="numeric" placeholder="Código" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
            </div>
            <button class="btn-print" id="setup-btn" type="button" style="margin-top:12px">Continuar</button>
          </div>
        </div>
      </div>
    </div>
  `;
  let empleados = [];
  try{ empleados = await fetchEmpleados(); }
  catch(err){
    const l = byId('setup-loading');
    if(l) l.textContent = 'No se pudo cargar. Revisa tu conexión e inténtalo de nuevo.';
    return;
  }
  const l = byId('setup-loading');
  if(l) l.style.display = 'none';
  byId('setup-form').style.display = 'block';
  byId('setup-nombre').innerHTML = selectOptions(empleados.map(e=>e.nombre), '', 'Selecciona tu nombre');
  byId('setup-btn').onclick = ()=>{
    const nombre = byId('setup-nombre').value;
    const codigo = byId('setup-codigo').value.trim();
    if(!nombre || !codigo){ showNotice('Falta información', 'Selecciona tu nombre y escribe tu código.'); return; }
    const match = empleados.find(e=> e.nombre===nombre && String(e.codigo)===String(codigo));
    if(!match){ renderSetupGate('Nombre o código incorrecto.'); return; }
    setSession({ nombre, codigo });
    init();
  };
}

/* -------- render principal -------- */

function render(){
  const session = getSession();
  if(!session){ renderSetupGate(); return; }

  const app = byId('app');
  app.innerHTML = '';

  const top = document.createElement('div');
  top.className = 'topbar';
  top.innerHTML = `
    <div class="brand-row">
      <img class="brand-icon" src="data:image/png;base64,${LOGO_ICON_B64}" alt="La Negra Tomasa de Sol">
      <img class="brand-word" src="data:image/png;base64,${LOGO_WORD_B64}" alt="La Negra Tomasa de Sol">
    </div>
    <p class="topbar-sub">${esc(session.nombre)} · Control de sala</p>
    <div class="tabs">
      <div class="tab ${state.tab==='sala'?'active':''}" data-tab="sala">Plano de sala</div>
      <div class="tab ${state.tab==='resumen'?'active':''}" data-tab="resumen">Resumen</div>
    </div>
  `;
  app.appendChild(top);

  if(state.loading){
    const l = document.createElement('div');
    l.className = 'empty';
    l.textContent = 'Cargando plano de sala...';
    app.appendChild(l);
    attachTabHandlers();
    return;
  }

  if(state.tab === 'sala') renderSala(app);
  if(state.tab === 'resumen') renderResumen(app);

  if(state.selectedMesa !== null) renderMesaModal(app);
  if(state.confirmModal) renderConfirmModal(app);
  if(state.toastMsg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = state.toastMsg;
    app.appendChild(t);
  }

  attachTabHandlers();
}

function attachTabHandlers(){
  document.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ state.tab = el.dataset.tab; render(); };
  });
}

/* -------- plano de sala -------- */

function renderSala(app){
  const wrap = document.createElement('div');
  wrap.className = 'wrap';

  wrap.innerHTML = `
    <div class="legend">
      ${FASES.map(f=>`<span class="legend-item"><span class="legend-dot" style="background:var(${f.colorVar})"></span>${f.label}</span>`).join('')}
      <span class="legend-item"><span class="legend-dot" style="background:var(--f-alerta)"></span>Esperando atención</span>
    </div>
    <div class="floor ${state.editMode?'edit-mode':''}" id="floor">
      ${state.layout.length===0 ? '' : state.layout.map(m=>renderMesaHTML(m)).join('')}
    </div>
    ${state.layout.length===0 ? '<div class="empty">Todavía no hay mesas en el plano. Activa el modo edición para añadir la primera.</div>' : ''}
  `;
  app.appendChild(wrap);

  const isAdmin = state.adminUnlocked;
  const editBar = document.createElement('div');
  editBar.innerHTML = `
    <button class="btn-edit-toggle ${state.editMode?'active':''}" id="btn-edit-toggle" type="button">
      ${state.editMode ? 'Salir del modo edición' : 'Editar plano de sala'}
    </button>
    ${state.editMode ? `
      <div class="edit-row">
        <button id="btn-add-mesa" type="button">+ Añadir mesa</button>
        <button id="btn-add-redonda" type="button">+ Añadir mesa redonda</button>
      </div>
    ` : ''}
  `;
  wrap.appendChild(editBar);

  byId('btn-edit-toggle').onclick = ()=>{
    if(state.editMode){ state.editMode = false; render(); return; }
    if(isAdmin){ state.editMode = true; render(); return; }
    renderAdminGate(()=>{ state.editMode = true; render(); });
  };
  const btnAdd = byId('btn-add-mesa');
  if(btnAdd) btnAdd.onclick = ()=> agregarMesa('rect');
  const btnAddR = byId('btn-add-redonda');
  if(btnAddR) btnAddR.onclick = ()=> agregarMesa('round');

  wireMesaElements();
}

function faseActualDe(mesaId){
  const e = state.estado[mesaId];
  return e && e.estado ? e.estado : 'libre';
}

function renderMesaHTML(m){
  const fase = faseActualDe(m.id);
  const info = faseInfo(fase);
  const e = state.estado[m.id] || {};
  let alerta = false;
  if(fase === 'ocupada'){
    const minEsperando = minutosDesde(e.horaOcupada);
    if(minEsperando !== null && minEsperando >= ALERTA_MINUTOS) alerta = true;
  }
  let tiempoTxt = '';
  if(fase !== 'libre'){
    const horaKey = info.horaKey;
    const min = minutosDesde(e[horaKey]);
    tiempoTxt = fmtMinutos(min);
  }
  const w = m.w || 60, h = m.h || 60;
  return `
    <div class="mesa ${m.forma==='round'?'round':''} ${alerta?'alerta':''}" data-id="${esc(m.id)}"
      style="left:${m.x}%; top:${m.y}%; width:${w}px; height:${h}px; background:${alerta?'var(--f-alerta)':`var(${info.colorVar})`}; color:${alerta?'#fff':`var(${info.colorVar}-ink, var(--ink))`};">
      <div class="mesa-num">${esc(m.numero)}</div>
      ${tiempoTxt ? `<div class="mesa-time">${tiempoTxt}</div>` : ''}
    </div>
  `;
}

function wireMesaElements(){
  document.querySelectorAll('.mesa').forEach(el=>{
    if(state.editMode){
      wireDrag(el);
      el.onclick = null;
    }else{
      el.onclick = ()=>{ state.selectedMesa = el.dataset.id; render(); };
    }
  });
}

function wireDrag(el){
  let dragging = false;
  let floor, floorRect;
  const start = (clientX, clientY)=>{
    dragging = true;
    el.classList.add('dragging');
    floor = byId('floor');
    floorRect = floor.getBoundingClientRect();
  };
  const move = (clientX, clientY)=>{
    if(!dragging) return;
    let xPct = ((clientX - floorRect.left) / floorRect.width) * 100;
    let yPct = ((clientY - floorRect.top) / floorRect.height) * 100;
    xPct = Math.max(0, Math.min(94, xPct));
    yPct = Math.max(0, Math.min(94, yPct));
    el.style.left = xPct + '%';
    el.style.top = yPct + '%';
    el.dataset._x = xPct;
    el.dataset._y = yPct;
  };
  const end = ()=>{
    if(!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    const id = el.dataset.id;
    const x = el.dataset._x !== undefined ? parseFloat(el.dataset._x) : null;
    const y = el.dataset._y !== undefined ? parseFloat(el.dataset._y) : null;
    if(x !== null && y !== null){
      const mesa = state.layout.find(m=>m.id===id);
      if(mesa){ mesa.x = Math.round(x*10)/10; mesa.y = Math.round(y*10)/10; }
      guardarLayoutDebounced();
    }
  };
  el.addEventListener('mousedown', e=>{ start(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e=> move(e.clientX, e.clientY));
  window.addEventListener('mouseup', end);
  el.addEventListener('touchstart', e=>{ const t=e.touches[0]; start(t.clientX, t.clientY); }, {passive:true});
  el.addEventListener('touchmove', e=>{ const t=e.touches[0]; move(t.clientX, t.clientY); }, {passive:true});
  el.addEventListener('touchend', end);
}

let guardarLayoutTimeout = null;
function guardarLayoutDebounced(){
  if(guardarLayoutTimeout) clearTimeout(guardarLayoutTimeout);
  guardarLayoutTimeout = setTimeout(async ()=>{
    try{ await guardarLayout(state.layout); showToast('Plano guardado'); }
    catch(err){ showNotice('Error', 'No se pudo guardar la posición de la mesa.'); }
  }, 700);
}

async function agregarMesa(forma){
  const numero = String(state.layout.length + 1);
  const nueva = { id: 'm' + Date.now(), numero, x: 10, y: 10, w: forma==='round'?60:70, h: 60, forma };
  const nuevoLayout = [...state.layout, nueva];
  try{
    await guardarLayout(nuevoLayout);
    render();
  }catch(err){
    showNotice('Error', 'No se pudo añadir la mesa.');
  }
}

/* -------- puerta de administrador (editar plano) -------- */

function renderAdminGate(onSuccess){
  openConfirm({
    title: 'Solo para encargados',
    message: 'Editar el plano de sala está reservado a Jose, Jorge o Laura. Pídeles que lo hagan, o introduce la contraseña si eres uno de ellos.',
    confirmLabel: 'Cerrar',
    hideCancel: true
  });
  // Mostramos un mini formulario aparte reutilizando el patron de historial
  setTimeout(()=>{
    const overlay = document.querySelector('.modal-overlay');
    if(!overlay) return;
    const body = overlay.querySelector('.card-body');
    if(!body) return;
    body.innerHTML += `
      <div class="field" style="margin-top:14px">
        <label>¿Eres encargado? Selecciona tu nombre</label>
        <select id="admin-select">${selectOptions(ADMIN_AUTORIZADOS, '', 'Selecciona')}</select>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Contraseña</label>
        <input type="text" id="admin-pass" placeholder="Contraseña">
      </div>
      <button class="btn-print" id="admin-try" type="button" style="margin-top:10px">Entrar</button>
    `;
    byId('admin-try').onclick = ()=>{
      const sel = byId('admin-select').value;
      const pass = byId('admin-pass').value;
      if(sel && pass === ADMIN_PASSWORD){
        state.adminUnlocked = true;
        state.confirmModal = null;
        onSuccess();
      }else{
        showNotice('Acceso denegado', 'Nombre o contraseña incorrectos.');
      }
    };
  }, 30);
}

/* -------- modal de detalle de mesa -------- */

function renderMesaModal(app){
  const mesa = state.layout.find(m=>m.id === state.selectedMesa);
  if(!mesa){ state.selectedMesa = null; return; }
  const e = state.estado[mesa.id] || {};
  const fase = faseActualDe(mesa.id);
  const info = faseInfo(fase);
  const idx = faseIdx(fase);
  const siguiente = FASES[idx+1];

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h2>Mesa ${esc(mesa.numero)}</h2>
        <button class="modal-close-x" id="mesa-close" type="button">&times;</button>
      </div>
      <span class="fase-badge" style="background:var(${info.colorVar});color:var(${info.colorVar}-ink, var(--ink))">${info.label}</span>

      <div class="timeline">
        ${FASES.filter(f=>f.horaKey).map(f=>`
          <div class="timeline-row">
            <span class="lbl">${f.label}</span>
            <span class="val">${e[f.horaKey] ? fmtHora(e[f.horaKey]) : '—'}</span>
          </div>
        `).join('')}
        ${e.horaOcupada && e.horaAtendida ? `
          <div class="timeline-row"><span class="lbl">Tiempo hasta ser atendida</span><span class="val">${fmtMinutos(Math.round((new Date(e.horaAtendida)-new Date(e.horaOcupada))/60000))}</span></div>
        ` : ''}
        ${e.camarero ? `<div class="timeline-row"><span class="lbl">Camarero</span><span class="val">${esc(e.camarero)}</span></div>` : ''}
      </div>

      ${siguiente ? `<button class="btn-avanzar" id="btn-avanzar" type="button">Avanzar a: ${siguiente.label}</button>` : ''}
      ${fase === 'cobrada' ? `<button class="btn-avanzar" id="btn-liberar-ok" type="button">Liberar mesa</button>` : ''}
      ${fase !== 'libre' ? `<button class="btn-liberar" id="btn-liberar" type="button">Liberar mesa ahora (vaciar sin cobrar)</button>` : ''}
      <button class="btn-secundario2" id="mesa-cerrar" type="button">Cerrar</button>
    </div>
  `;
  app.appendChild(overlay);

  byId('mesa-close').onclick = ()=>{ state.selectedMesa = null; render(); };
  byId('mesa-cerrar').onclick = ()=>{ state.selectedMesa = null; render(); };
  overlay.onclick = (ev)=>{ if(ev.target === overlay){ state.selectedMesa = null; render(); } };

  const btnAvanzar = byId('btn-avanzar');
  if(btnAvanzar) btnAvanzar.onclick = ()=> avanzarFase(mesa.id, siguiente);

  const btnLiberarOk = byId('btn-liberar-ok');
  if(btnLiberarOk) btnLiberarOk.onclick = ()=> liberarMesa(mesa.id);

  const btnLiberar = byId('btn-liberar');
  if(btnLiberar) btnLiberar.onclick = ()=>{
    openConfirm({
      title:'Liberar mesa',
      message:`¿Vaciar la mesa ${mesa.numero} y ponerla como libre? Se perderá el registro de horarios de este servicio.`,
      confirmLabel:'Liberar', danger:true,
      onConfirm: ()=> liberarMesa(mesa.id)
    });
  };
}

async function avanzarFase(mesaId, siguiente){
  if(state.saving) return;
  state.saving = true;
  const session = getSession();
  const cambios = { estado: siguiente.key, camarero: session ? session.nombre : '' };
  if(siguiente.horaKey) cambios[siguiente.horaKey] = nowISO();
  try{
    await actualizarMesaSegura(mesaId, cambios);
    showToast(`Mesa actualizada: ${siguiente.label}`);
    render();
  }catch(err){
    const detalle = (err && err.message) ? err.message : String(err);
    showNotice('No se pudo actualizar', detalle);
  }finally{
    state.saving = false;
  }
}

async function liberarMesa(mesaId){
  if(state.saving) return;
  state.saving = true;
  try{
    await actualizarMesaSegura(mesaId, {
      estado:'libre', camarero:'', horaOcupada:null, horaAtendida:null,
      horaPrimeros:null, horaSegundos:null, horaPostres:null, horaCobrada:null
    });
    state.selectedMesa = null;
    showToast('Mesa liberada');
    render();
  }catch(err){
    showNotice('Error', 'No se pudo liberar la mesa.');
  }finally{
    state.saving = false;
  }
}

/* -------- resumen -------- */

function renderResumen(app){
  const wrap = document.createElement('div');
  wrap.className = 'wrap';
  const mesas = state.layout;
  const ocupadas = mesas.filter(m=> faseActualDe(m.id) !== 'libre');
  const esperando = mesas.filter(m=> faseActualDe(m.id) === 'ocupada');
  const alertas = esperando.filter(m=>{
    const e = state.estado[m.id]||{};
    const min = minutosDesde(e.horaOcupada);
    return min !== null && min >= ALERTA_MINUTOS;
  });

  wrap.innerHTML = `
    <div class="card">
      <div class="card-head">Resumen ahora mismo</div>
      <div class="card-body">
        <div class="timeline-row"><span class="lbl">Mesas totales</span><span class="val">${mesas.length}</span></div>
        <div class="timeline-row"><span class="lbl">Ocupadas</span><span class="val">${ocupadas.length}</span></div>
        <div class="timeline-row"><span class="lbl">Esperando ser atendidas</span><span class="val">${esperando.length}</span></div>
        <div class="timeline-row"><span class="lbl">Con demora (${ALERTA_MINUTOS}+ min sin atender)</span><span class="val">${alertas.length}</span></div>
      </div>
    </div>
    ${ocupadas.length===0 ? '<div class="empty">No hay mesas ocupadas ahora mismo.</div>' : ''}
    ${ocupadas.map(m=>{
      const e = state.estado[m.id]||{};
      const fase = faseActualDe(m.id);
      const info = faseInfo(fase);
      return `
        <div class="card">
          <div class="card-head" style="background:var(${info.colorVar});color:var(${info.colorVar}-ink, var(--ink))">Mesa ${esc(m.numero)} · ${info.label}</div>
          <div class="card-body">
            <div class="timeline-row"><span class="lbl">Ocupada desde</span><span class="val">${fmtHora(e.horaOcupada)} (${fmtMinutos(minutosDesde(e.horaOcupada))})</span></div>
            ${e.horaAtendida ? `<div class="timeline-row"><span class="lbl">Atendida</span><span class="val">${fmtHora(e.horaAtendida)}</span></div>` : ''}
            ${e.camarero ? `<div class="timeline-row"><span class="lbl">Camarero</span><span class="val">${esc(e.camarero)}</span></div>` : ''}
          </div>
        </div>
      `;
    }).join('')}
  `;
  app.appendChild(wrap);
}

/* -------- modal de confirmación genérico -------- */

function renderConfirmModal(app){
  const m = state.confirmModal;
  if(!m) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="card">
        <div class="card-head">${esc(m.title)}</div>
        <div class="card-body">
          <p style="margin:0 0 16px;font-size:14px;line-height:1.5">${esc(m.message)}</p>
          <div style="display:flex;gap:10px">
            ${m.hideCancel ? '' : `<button class="btn-secondary" id="confirm-cancel" type="button" style="flex:1;width:auto">${esc(m.cancelLabel)}</button>`}
            <button class="btn-print" id="confirm-ok" type="button" style="flex:1;width:auto;margin:0">${esc(m.confirmLabel)}</button>
          </div>
        </div>
      </div>
    </div>
  `;
  app.appendChild(overlay);
  const cancelBtn = byId('confirm-cancel');
  if(cancelBtn) cancelBtn.onclick = closeConfirm;
  byId('confirm-ok').onclick = ()=>{
    const cb = m.onConfirm;
    state.confirmModal = null;
    if(cb) cb();
    else render();
  };
}

init();
</script>
