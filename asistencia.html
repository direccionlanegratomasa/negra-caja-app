:root{
  --amarillo:#FFD400; --amarillo-claro:#FFF6D0; --amarillo-borde:#F0DC8A;
  --tinta:#1C1A12; --papel:#F6F4EE; --blanco:#FFFFFF; --linea:#DDD7C6; --pista:#ECE7D8; --suave:#6B6558;
  --ladrillo:#B23A2E; --sube:#17623F; --sube-bg:#D9F2E5; --baja:#8E2A21; --baja-bg:#F8DCD8;
  --sans:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--papel); color:var(--tinta); font-family:var(--sans); font-size:18px; line-height:1.45; font-variant-numeric:tabular-nums; }
button, input{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--tinta); outline-offset:2px; }
.oculto{ display:none !important; }
.cab{ background:var(--amarillo); border-bottom:4px solid var(--tinta); }
.cab-in{ max-width:560px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; }
.marca{ display:flex; align-items:center; gap:12px; }
.marca .ico{ height:54px; width:auto; display:block; }
.marca .pal{ height:46px; width:auto; display:block; }
.cab-txt{ text-align:right; line-height:1.2; }
.cab-txt b{ display:block; font-size:19px; font-weight:700; letter-spacing:-.01em; }
.cab-txt small{ display:block; margin-top:3px; font-size:13px; color:#4A3B00; }
@media (max-width:480px){ .marca .ico{ height:46px; } .marca .pal{ height:38px; } .cab-txt{ text-align:left; width:100%; } }
main{ max-width:560px; margin:0 auto; padding:22px 16px 60px; }
.caja{ background:var(--blanco); border:2px solid var(--tinta); border-radius:10px; padding:20px 18px; box-shadow:4px 4px 0 var(--tinta); }
h1{ margin:0 0 6px; font-size:24px; letter-spacing:-.01em; }
h2{ margin:0 0 10px; font-size:18px; }
.sub{ margin:0 0 18px; color:var(--suave); font-size:16px; }
label{ display:block; font-weight:700; font-size:16px; margin:0 0 6px; }
.campo{ width:100%; border:2px solid var(--tinta); border-radius:8px; background:var(--blanco); padding:14px 14px; min-height:56px; font-size:22px; font-weight:500; }
.campo::placeholder{ color:#A39D87; font-weight:400; }
.fila{ margin-bottom:18px; }
.dos{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.ayuda{ margin:6px 0 0; font-size:14px; color:var(--suave); }
.btn{ display:block; width:100%; min-height:60px; border:2px solid var(--tinta); border-radius:10px; background:var(--amarillo); font-weight:700; font-size:20px; padding:12px 16px; box-shadow:3px 3px 0 var(--tinta); }
.btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--tinta); }
.btn[disabled]{ opacity:.55; cursor:default; }
.btn.claro{ background:var(--blanco); font-size:16px; min-height:48px; box-shadow:none; }
.btn.chico{ display:inline-block; width:auto; min-height:44px; font-size:15px; padding:8px 14px; box-shadow:none; background:var(--blanco); }
.msg{ border:2px solid var(--tinta); border-radius:8px; padding:12px 14px; margin:0 0 16px; font-size:16px; font-weight:500; }
.msg.mal{ background:var(--baja-bg); border-color:var(--baja); color:var(--baja); }
.msg.bien{ background:var(--sube-bg); border-color:var(--sube); color:var(--sube); }
.msg.aviso{ background:var(--amarillo-claro); border-color:#C98F00; color:#4A3B00; }
.msg b{ display:block; font-size:19px; }
.hist{ list-style:none; margin:0; padding:0; }
.hist li{ border-bottom:1px solid var(--linea); }
.hist li:last-child{ border-bottom:0; }
.hist button{ width:100%; text-align:left; background:none; border:0; padding:12px 2px; display:grid; grid-template-columns:1fr auto; gap:2px 12px; min-height:56px; }
.hist .f{ font-weight:700; }
.hist .d{ color:var(--suave); font-size:15px; text-align:right; }
.hist .l{ grid-column:1 / span 2; font-size:14px; color:var(--suave); }
.arriba{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 14px; font-size:15px; color:var(--suave); }
.espacio{ height:22px; }
.solo-lector{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.cab-in, main{ max-width:760px; }
.dias{ display:flex; gap:10px; margin:0 0 14px; }
.dias button{ flex:1; min-height:56px; border:2px solid var(--tinta); border-radius:10px; background:var(--blanco); font-weight:700; font-size:18px; padding:6px 10px; line-height:1.2; }
.dias button[aria-pressed="true"]{ background:var(--tinta); color:var(--amarillo); }
.dias small{ display:block; font-weight:500; font-size:13px; opacity:.85; }
.turnos{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 14px; }
.turnos button{ min-height:72px; border:2px solid var(--tinta); border-radius:10px; background:var(--blanco); font-weight:700; font-size:26px; line-height:1.1; padding:8px 6px; }
.turnos button small{ display:block; font-size:14px; font-weight:500; margin-top:2px; }
.turnos button[aria-pressed="true"]{ background:var(--amarillo); box-shadow:3px 3px 0 var(--tinta); }
.resumen{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 10px; font-size:17px; font-weight:700; }
.resumen span{ font-weight:500; color:var(--suave); font-size:15px; }
.buscar{ margin:0 0 12px; }
.pers{ list-style:none; margin:0; padding:0; }
.pers li{ display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--linea); min-height:76px; flex-wrap:wrap; }
.pers li:last-child{ border-bottom:0; }
.pers .nom{ flex:1 1 180px; font-size:20px; font-weight:600; line-height:1.2; }
.pers .nom small{ display:block; font-size:13px; font-weight:500; color:var(--suave); }
.pers.dentro .ya{ background:var(--sube-bg); }
.llego{ min-width:150px; min-height:64px; border:2px solid var(--tinta); border-radius:10px; background:var(--amarillo); font-weight:700; font-size:22px; box-shadow:3px 3px 0 var(--tinta); padding:8px 18px; }
.llego:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--tinta); }
.llego[disabled]{ opacity:.55; }
.hecho{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.hora{ background:var(--sube-bg); color:var(--sube); border:2px solid var(--sube); border-radius:10px; padding:10px 14px; font-weight:700; font-size:22px; min-height:56px; display:flex; align-items:center; }
.edit{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.edit input{ width:150px; min-height:56px; font-size:22px; }
.vacio{ color:var(--suave); padding:18px 4px; text-align:center; }
.pie{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
.pie .btn{ flex:1 1 220px; }
</style>

<main id="app"><noscript><p class="msg mal">Esta página necesita JavaScript.</p></noscript></main>
<script>
'use strict';
var URL_SERVICIO = 'https://script.google.com/macros/s/AKfycbywMYu2_J6dUi_MiZAaruB3WB_lXxfnpD1hD5pFZezFcTP8RW66tNQUQgefVGL_8uGTgw/exec';
var CLAVE_SESION = 'lnt-asistencia-sesion';
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var S = { token: '', paso: 'acceso', msg: null, cargando: false, dia: '', fecha: '', hora: '', turnos: ['17:00','21:30','00:30'], personas: [], marcas: {}, turno: '', q: '', editando: '', enCurso: {}, enviando: false, ok: '' };
var TICK = null;

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function isoLocal(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fechaLarga(iso){ var p = iso.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); return DIAS[d.getUTCDay()] + ' ' + (+p[2]) + ' de ' + MESES[+p[1] - 1]; }
function mayus(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function guardarSesion(v){ try { if (v) localStorage.setItem(CLAVE_SESION, JSON.stringify(v)); else localStorage.removeItem(CLAVE_SESION); } catch (e){} }
function leerSesion(){ try { var v = JSON.parse(localStorage.getItem(CLAVE_SESION) || 'null'); return v && typeof v.token === 'string' && v.expira && Date.parse(v.expira) > Date.now() ? v : null; } catch (e){ return null; } }

async function pedir(accion, datos){
  if (URL_SERVICIO.indexOf('http') !== 0) throw new Error('Falta indicar la dirección del servicio.');
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, t = ctl ? setTimeout(function(){ ctl.abort(); }, 45000) : null;
  try {
    var cuerpo = Object.assign({ accion: accion }, datos || {}); if (S.token && !cuerpo.token) cuerpo.token = S.token;
    var res = await fetch(URL_SERVICIO, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo), signal: ctl ? ctl.signal : undefined });
    var j; try { j = JSON.parse(await res.text()); } catch (e){ throw new Error('El servicio no ha respondido como se esperaba. Inténtalo de nuevo.'); }
    if (!j.ok){ var e = new Error(j.error || 'No se ha podido completar.'); e.codigo = j.codigo || ''; throw e; }
    return j;
  } catch (e){
    if (e && e.name === 'AbortError') throw new Error('El servicio tarda demasiado. Comprueba la conexión e inténtalo de nuevo.');
    if (e instanceof TypeError) throw new Error('No hay conexión con el servicio. Comprueba internet e inténtalo de nuevo.');
    throw e;
  } finally { if (t) clearTimeout(t); }
}


function quitarTildes(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function sumarDias(iso, n){ var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10); }
function fechaCorta(iso){ var p = iso.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); return DIAS[d.getUTCDay()].slice(0, 3) + ' ' + (+p[2]) + ' ' + MESES[+p[1] - 1].slice(0, 3); }
function minutos(h){ var p = h.split(':'), m = +p[0] * 60 + +p[1]; return m < 360 ? m + 1440 : m; }
function turnoPorHora(h){ var m = minutos(h); return m < 1155 ? S.turnos[0] : (m < 1380 ? S.turnos[1] : S.turnos[2]); }
function marcasDe(t){ return (S.marcas && S.marcas[t]) || {}; }
function sesionCaducada(){ guardarSesion(null); S.token = ''; S.paso = 'acceso'; S.msg = 'Tu acceso ha caducado. Escribe tu código otra vez.'; parar(); }
function parar(){ if (TICK){ clearInterval(TICK); TICK = null; } }

function vistaAcceso(){
  return '<section class="caja"><h1>Tu código</h1><p class="sub">Escribe tu código para registrar quién ha venido a trabajar.</p>' +
    (S.msg ? '<p class="msg mal" role="alert">' + esc(S.msg) + '</p>' : '') +
    '<form id="f-acceso" autocomplete="off"><div class="fila"><label for="codigo">Código</label>' +
    '<input class="campo" id="codigo" name="codigo" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="12" required></div>' +
    '<button class="btn" type="submit"' + (S.cargando ? ' disabled' : '') + '>' + (S.cargando ? 'Comprobando…' : 'Entrar') + '</button></form></section>';
}
function filaPersona(p){
  var m = marcasDe(S.turno)[p.id], otros = [];
  S.turnos.forEach(function(t){ if (t !== S.turno && marcasDe(t)[p.id]) otros.push(t + ' (' + marcasDe(t)[p.id].h + ')'); });
  var nom = '<div class="nom">' + esc(p.nombre) + (otros.length ? '<small>También en ' + esc(otros.join(', ')) + '</small>' : '') + '</div>', acc;
  if (m && S.editando === p.id){
    acc = '<form class="edit" data-form="hora" data-id="' + esc(p.id) + '"><input class="campo" type="time" id="hora-edit" value="' + esc(m.h) + '" required>' +
      '<button class="btn chico" type="submit">Guardar</button><button type="button" class="btn chico" data-act="cancelar">Cancelar</button></form>';
  } else if (m){
    acc = '<div class="hecho"><span class="hora" aria-label="Llegó a las ' + esc(m.h) + '">✓ ' + esc(m.h) + '</span>' +
      '<button type="button" class="btn chico" data-act="hora" data-id="' + esc(p.id) + '">Hora</button>' +
      '<button type="button" class="btn chico" data-act="quitar" data-id="' + esc(p.id) + '" data-n="' + esc(p.nombre) + '">Quitar</button></div>';
  } else {
    var ocupado = !!S.enCurso[p.id + '|' + S.turno];
    acc = '<button type="button" class="llego" data-act="llego" data-id="' + esc(p.id) + '"' + (ocupado ? ' disabled' : '') + '>' + (ocupado ? '…' : 'Llegó') + '</button>';
  }
  return '<li' + (m ? ' class="ya"' : '') + '>' + nom + acc + '</li>';
}
function vistaTablet(){
  var h = '', q = quitarTildes(S.q.trim()), ayer = sumarDias(S.dia, -1), total = S.personas.length, llegados = Object.keys(marcasDe(S.turno)).length;
  h += '<div class="arriba"><span id="sync">Actualizado a las ' + esc(S.hora) + '</span><button type="button" class="btn chico" data-act="salir">Salir</button></div>';
  if (S.msg && S.msg.ok) h += '<div class="msg bien" role="status">' + esc(S.msg.ok) + '</div>';
  else if (S.msg) h += '<p class="msg mal" role="alert">' + esc(S.msg.texto) + '</p>';
  h += '<div class="dias" role="group" aria-label="Día"><button type="button" data-act="fecha" data-f="' + esc(S.dia) + '" aria-pressed="' + (S.fecha === S.dia) + '">Hoy<small>' + esc(fechaCorta(S.dia)) + '</small></button>' +
    '<button type="button" data-act="fecha" data-f="' + esc(ayer) + '" aria-pressed="' + (S.fecha === ayer) + '">Ayer<small>' + esc(fechaCorta(ayer)) + '</small></button></div>';
  h += '<div class="turnos" role="group" aria-label="Turno">' + S.turnos.map(function(t){
    return '<button type="button" data-act="turno" data-t="' + esc(t) + '" aria-pressed="' + (S.turno === t) + '">' + esc(t) + '<small>' + Object.keys(marcasDe(t)).length + ' han llegado</small></button>';
  }).join('') + '</div>';
  h += '<section class="caja"><div class="resumen"><b>Turno ' + esc(S.turno) + '</b><span>Han llegado ' + llegados + ' de ' + total + '</span></div>';
  if (!total) h += '<p class="vacio">La lista de autorizados está vacía. Jorge tiene que subir el Excel con las personas autorizadas.</p>';
  else {
    h += '<div class="buscar"><label for="buscar" class="solo-lector">Buscar persona</label><input class="campo" id="buscar" type="search" placeholder="Buscar por nombre…" autocomplete="off" value="' + esc(S.q) + '"></div>';
    var vis = S.personas.filter(function(p){ return !q || quitarTildes(p.nombre).indexOf(q) >= 0; });
    h += vis.length ? '<ul class="pers">' + vis.map(filaPersona).join('') + '</ul>' : '<p class="vacio">Nadie con ese nombre en la lista. Si no está en la lista, no puede entrar.</p>';
  }
  h += '</section><div class="pie"><button type="button" class="btn claro" data-act="informe"' + (S.enviando ? ' disabled' : '') + '>' + (S.enviando ? 'Enviando…' : 'Enviar el informe de este día a Jorge') + '</button></div>';
  return h;
}
function pintar(){
  var app = document.getElementById('app'), foco = document.activeElement, id = foco && foco.id, pos = id === 'buscar' ? foco.selectionStart : null;
  app.innerHTML = S.paso === 'acceso' ? vistaAcceso() : vistaTablet();
  document.getElementById('quien').textContent = S.paso === 'acceso' ? 'Acceso con tu código' : mayus(fechaLarga(S.fecha));
  if (id){ var e = document.getElementById(id); if (e && e.focus){ try { e.focus(); if (pos !== null && e.setSelectionRange) e.setSelectionRange(pos, pos); } catch (x){} } }
  else if (S.editando){ var he = document.getElementById('hora-edit'); if (he) he.focus(); }
}
function aplicar(j){
  S.dia = j.dia; S.fecha = j.fecha; S.hora = j.hora; S.turnos = j.turnos || S.turnos; S.personas = j.personas || []; S.marcas = j.marcas || {};
  if (!S.turno || S.turnos.indexOf(S.turno) < 0) S.turno = turnoPorHora(j.hora);
}
async function cargar(fecha, silencioso){
  var j = await pedir('asistenciaLeer', fecha ? { fecha: fecha } : {});
  if (silencioso && (S.editando || Object.keys(S.enCurso).length || fecha !== undefined && fecha !== S.fecha)) return;
  var primera = !S.fecha; aplicar(j); S.paso = 'tablet'; if (primera || !silencioso) pintar(); else pintar();
}
function arrancarRefresco(){
  parar();
  TICK = setInterval(async function(){
    if (S.paso !== 'tablet' || document.hidden || S.editando || Object.keys(S.enCurso).length || S.enviando) return;
    var antes = S.fecha; try { var j = await pedir('asistenciaLeer', { fecha: antes }); if (S.editando || antes !== S.fecha) return; aplicar(j); pintar(); } catch (e){ if (e.codigo === 'SESION'){ sesionCaducada(); pintar(); } }
  }, 60000);
}
async function entrar(codigo){
  S.cargando = true; S.msg = null; pintar();
  try {
    var j = await pedir('tecnico', { codigo: codigo });
    S.token = j.token; guardarSesion({ token: j.token, expira: j.expira });
    S.fecha = ''; S.turno = ''; await cargar(); arrancarRefresco();
  } catch (e){ S.paso = 'acceso'; S.msg = e.message; }
  S.cargando = false; pintar();
}
function fallo(e){
  if (e.codigo === 'SESION'){ sesionCaducada(); }
  else S.msg = { texto: e.message };
}
async function llego(id){
  var k = id + '|' + S.turno; if (S.enCurso[k]) return; S.enCurso[k] = 1; S.msg = null; pintar();
  try {
    var j = await pedir('asistenciaMarcar', { fecha: S.fecha, turno: S.turno, personaId: id });
    if (!S.marcas[j.turno]) S.marcas[j.turno] = {}; S.marcas[j.turno][id] = j.marca;
  } catch (e){ fallo(e); if (e.codigo === 'NOAUTORIZADO'){ try { await cargar(S.fecha); } catch (x){} } }
  delete S.enCurso[k]; pintar();
}
async function cambiarHora(id, hora){
  if (!/^\d{1,2}:\d{2}$/.test(hora)){ S.msg = { texto: 'Escribe la hora, por ejemplo 18:05.' }; pintar(); return; }
  var k = id + '|' + S.turno; S.enCurso[k] = 1;
  try {
    var j = await pedir('asistenciaMarcar', { fecha: S.fecha, turno: S.turno, personaId: id, hora: hora });
    S.marcas[j.turno][id] = j.marca; S.editando = ''; S.msg = null;
  } catch (e){ fallo(e); }
  delete S.enCurso[k]; pintar();
}
async function quitar(id, nombre){
  if (!confirm('¿Quitar a ' + nombre + ' del turno ' + S.turno + '? Se borra su hora de llegada.')) return;
  var k = id + '|' + S.turno; S.enCurso[k] = 1;
  try { await pedir('asistenciaQuitar', { fecha: S.fecha, turno: S.turno, personaId: id }); delete S.marcas[S.turno][id]; S.msg = null; }
  catch (e){ fallo(e); }
  delete S.enCurso[k]; pintar();
}
async function informe(){
  if (!confirm('¿Enviar a Jorge el informe de ' + fechaLarga(S.fecha) + '?')) return;
  S.enviando = true; S.msg = null; pintar();
  try { var j = await pedir('asistenciaInforme', { fecha: S.fecha }); S.msg = { ok: 'Informe enviado a ' + j.a + ' (' + j.registros + (j.registros === 1 ? ' registro).' : ' registros).') }; }
  catch (e){ fallo(e); }
  S.enviando = false; pintar(); window.scrollTo(0, 0);
}
document.addEventListener('submit', function(ev){
  ev.preventDefault();
  if (ev.target.id === 'f-acceso'){ var c = document.getElementById('codigo').value.trim(); if (!c){ S.msg = 'Escribe tu código.'; pintar(); return; } entrar(c); }
  else if (ev.target.dataset && ev.target.dataset.form === 'hora') cambiarHora(ev.target.dataset.id, document.getElementById('hora-edit').value.trim());
});
document.addEventListener('input', function(ev){ if (ev.target.id === 'buscar'){ S.q = ev.target.value; pintar(); } });
document.addEventListener('click', function(ev){
  var b = ev.target.closest && ev.target.closest('[data-act]'); if (!b) return; var a = b.dataset.act;
  if (a === 'salir'){ guardarSesion(null); parar(); S = { token: '', paso: 'acceso', msg: null, cargando: false, dia: '', fecha: '', hora: '', turnos: S.turnos, personas: [], marcas: {}, turno: '', q: '', editando: '', enCurso: {}, enviando: false }; pintar(); }
  else if (a === 'turno'){ S.turno = b.dataset.t; S.editando = ''; S.msg = null; pintar(); }
  else if (a === 'fecha'){ if (b.dataset.f === S.fecha) return; S.editando = ''; S.msg = null; cargar(b.dataset.f).catch(function(e){ fallo(e); pintar(); }); }
  else if (a === 'llego') llego(b.dataset.id);
  else if (a === 'hora'){ S.editando = b.dataset.id; S.msg = null; pintar(); }
  else if (a === 'cancelar'){ S.editando = ''; pintar(); }
  else if (a === 'quitar') quitar(b.dataset.id, b.dataset.n);
  else if (a === 'informe') informe();
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden && S.paso === 'tablet' && !S.editando && !Object.keys(S.enCurso).length){ cargar(S.fecha, true).catch(function(e){ if (e.codigo === 'SESION'){ sesionCaducada(); pintar(); } }); } });
(async function(){
  var v = leerSesion();
  if (v){ S.token = v.token; S.cargando = true; pintar(); try { await cargar(); arrancarRefresco(); } catch (e){ S.token = ''; guardarSesion(null); S.paso = 'acceso'; S.msg = e.codigo === 'SESION' ? null : e.message; } S.cargando = false; }
  pintar();
})();
</script>
