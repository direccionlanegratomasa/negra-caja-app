:root{
  --amarillo:#FFD400;        /* amarillo corporativo */
  --amarillo-claro:#FFF6D0;
  --amarillo-borde:#F0DC8A;
  --tinta:#1C1A12;           /* negro del logotipo */
  --papel:#F6F4EE;
  --blanco:#FFFFFF;
  --linea:#DDD7C6;
  --pista:#ECE7D8;
  --suave:#6B6558;
  --ambar:#C98F00;
  --ladrillo:#B23A2E;
  --oliva:#6E7A3A;
  --piedra:#A39D87;
  --sube:#17623F; --sube-bg:#D9F2E5;
  --baja:#8E2A21; --baja-bg:#F8DCD8;
  --sans:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--papel); color:var(--tinta); font-family:var(--sans); font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums; }
button, select, input{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--tinta); outline-offset:2px; }
.oscuro :focus-visible, .tabs :focus-visible{ outline-color:var(--amarillo); }
.oculto{ display:none !important; }
.solo-lector{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- Cabecera de marca ---------- */
.cab{ background:var(--amarillo); color:var(--tinta); border-bottom:4px solid var(--tinta); }
.cab-in{ max-width:1100px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px 24px; flex-wrap:wrap; }
.marca{ display:flex; align-items:center; gap:12px; }
.marca .ico{ height:62px; width:auto; display:block; }
.marca .pal{ height:54px; width:auto; display:block; }
.cab-txt{ text-align:right; line-height:1.2; }
.cab-txt b{ display:block; font-size:20px; font-weight:700; letter-spacing:-.01em; }
.cab-txt small{ display:block; margin-top:3px; font-size:13px; color:#4A3B00; }
@media (max-width:620px){ .marca .ico{ height:50px; } .marca .pal{ height:44px; } .cab-in{ padding:12px 16px; } .cab-txt{ text-align:left; width:100%; } .cab-txt b{ font-size:18px; } .cab-txt small{ margin-top:2px; } }

/* ---------- Pestañas ---------- */
.tabs{ background:var(--tinta); position:sticky; top:0; z-index:30; }
.tabs-in{ max-width:1100px; margin:0 auto; padding:0 6px; display:flex; gap:0; overflow-x:auto; scrollbar-width:none; }
.tabs-in::-webkit-scrollbar{ display:none; }
.tab{ flex:1 1 auto; background:none; border:0; color:#E7E1CC; padding:14px 8px 12px; font-weight:500; font-size:15px; border-bottom:4px solid transparent; white-space:nowrap; text-align:center; }
.tab[aria-selected="true"]{ color:var(--amarillo); border-bottom-color:var(--amarillo); font-weight:700; }
.tab:hover{ color:#fff; }

/* ---------- Página ---------- */
.pag{ max-width:1100px; margin:0 auto; padding:18px 18px 56px; }
.vacio{ background:var(--blanco); border:2px dashed var(--linea); border-radius:10px; padding:28px 20px; text-align:center; color:var(--suave); }
.vacio b{ display:block; color:var(--tinta); font-size:18px; margin-bottom:4px; }
.aviso{ border-radius:10px; padding:11px 14px; font-size:14.5px; border:1.5px solid; margin:12px 0; }
.aviso.err{ background:var(--baja-bg); border-color:#E0A39B; color:var(--baja); }
.aviso.warn{ background:var(--amarillo-claro); border-color:var(--amarillo-borde); color:#5C4400; }
.aviso.ok{ background:var(--sube-bg); border-color:#9DC7B4; color:var(--sube); }
.aviso.info{ background:#F1F0EA; border-color:var(--linea); color:var(--tinta); }

/* ---------- Controles ---------- */
.seg{ display:inline-flex; border:2px solid var(--tinta); border-radius:10px; overflow:hidden; background:var(--blanco); max-width:100%; }
.seg button{ background:none; border:0; padding:9px 14px; font-weight:500; white-space:nowrap; border-right:2px solid var(--tinta); min-height:40px; }
.seg button:last-child{ border-right:0; }
.seg button[aria-pressed="true"]{ background:var(--tinta); color:var(--amarillo); font-weight:700; }
.seg button:hover:not([aria-pressed="true"]){ background:var(--amarillo-claro); }
@media (max-width:420px){ .seg button{ padding:9px 10px; } }
.seg.scroll{ overflow-x:auto; scrollbar-width:none; }
.seg.scroll::-webkit-scrollbar{ display:none; }
.btn{ font-weight:700; border-radius:10px; padding:12px 20px; border:2px solid var(--tinta); background:var(--tinta); color:var(--amarillo); min-height:44px; }
.btn:hover:not(:disabled){ background:#000; box-shadow:0 0 0 3px rgba(255,212,0,.6); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn.claro{ background:var(--blanco); color:var(--tinta); }
.btn.claro:hover:not(:disabled){ background:var(--amarillo-claro); }
.btn.peligro{ background:var(--blanco); color:var(--baja); border-color:var(--baja); }
.sel, .campo{ width:100%; border:2px solid var(--tinta); border-radius:10px; background:var(--blanco); padding:9px 12px; min-height:44px; font-weight:500; }
.sel{ appearance:none; -webkit-appearance:none; padding-right:36px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%231C1A12' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
  background-repeat:no-repeat; background-position:right 12px center; }
.flecha{ width:44px; min-width:44px; height:44px; border:2px solid var(--tinta); border-radius:10px; background:var(--blanco); display:inline-flex; align-items:center; justify-content:center; padding:0; }
.flecha:hover:not(:disabled){ background:var(--amarillo-claro); }
.flecha:disabled{ opacity:.3; cursor:not-allowed; }
.flecha svg{ width:16px; height:16px; stroke:var(--tinta); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- Variación (sube / baja) ---------- */
.delta{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 10px; font-weight:700; font-size:14px; line-height:1.3; white-space:nowrap; }
.delta svg{ width:10px; height:10px; fill:currentColor; }
.delta.sube{ background:var(--sube-bg); color:var(--sube); }
.delta.baja{ background:var(--baja-bg); color:var(--baja); }
.delta.igual{ background:#ECE7D8; color:var(--tinta); }

/* ---------- Bloques (comunes) ---------- */
.bloque{ border-top:4px solid var(--tinta); padding-top:14px; min-width:0; }
.bloque > h2, .bloque-cab h2{ margin:0 0 14px; font-size:22px; font-weight:700; letter-spacing:-.015em; }
.bloque-cab{ display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; margin-bottom:14px; }
.bloque-cab h2{ margin:0; }
.sub-txt{ color:var(--suave); font-size:14px; margin:-6px 0 14px; }
.pag > .bloque{ margin-bottom:34px; }
.notas{ padding-left:20px; margin:0; } .notas li{ margin-bottom:8px; }
.contador{ color:var(--suave); font-size:14px; margin:0 0 8px; }

/* ---------- Acceso con código ---------- */
.acceso{ max-width:460px; }
.acceso label{ font-weight:500; font-size:14px; display:block; margin-bottom:4px; }

.btn.peq{ padding:7px 14px; min-height:38px; font-size:14px; }

.barra-guardar{ position:sticky; bottom:0; padding:14px 0; background:linear-gradient(to top, var(--papel) 70%, transparent); margin-top:10px; }

<body>
<div id="app"></div>
<noscript>Esta página necesita JavaScript para cargar las ventas.</noscript>
<script>
/* ============================================================
   Núcleo compartido · Ventas La Negra Tomasa de Sol
   (acceso a datos, modelo, periodos, agregación, comparativas)
   Sin dependencias de la interfaz: se puede probar en Node.
   ============================================================ */
var TOM = (function(){
'use strict';

var CFG = {
  categoriasBase: ['Bebidas', 'Platos principales', 'Entrantes / compartir', 'Postres', 'Complementos', 'Promociones / entradas'],
  sinClasificar: 'Sin clasificar',
  excluido: 'Cupones (no cuentan)',             // productos que el análisis ignora por completo (cupones)
  musicos: 'Consumiciones de músicos',          // no suman en las ventas; se muestran aparte
  entradas: 'Promociones / entradas',           // entradas: se detallan por proveedor
  sinProveedor: 'Sin proveedor'
};

/* ---------- Texto y números ---------- */
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
var DIAS_C = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
var DIAS_L = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];

function pad(n){ return (n < 10 ? '0' : '') + n; }
function fmtNum(x, dec){
  dec = dec || 0;
  var neg = x < 0 && Math.round(Math.abs(x) * Math.pow(10, dec)) > 0;
  var s = Math.abs(x).toFixed(dec), p = s.split('.');
  var ent = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '\u2212' : '') + ent + (p[1] ? ',' + p[1] : '');
}
function fmtEur(cents){ return fmtNum(cents / 100, 2) + '\u00a0€'; }
function fmtEurEnt(cents){ return fmtNum(Math.round(cents / 100), 0) + '\u00a0€'; }
function fmtPct(p, dec){ return fmtNum(p, dec == null ? 1 : dec) + '\u00a0%'; }
function pctVar(actual, previo){ return previo > 0 ? (actual - previo) / previo * 100 : null; }

/* Clave de producto: sin acentos, mayúsculas, espacios simples. "Cremoso maracuyá" = "CREMOSO MARACUYA". */
function claveProducto(n){
  return String(n).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
}
function limpiarNombre(n){ return String(n).replace(/\s+/g, ' ').trim(); }
function nombreCentro(raw){ return titulo(limpiarNombre(String(raw).split('/')[0])); }
function titulo(s){ return String(s).toLowerCase().replace(/(^|\s)(\S)/g, function(_, a, b){ return a + b.toUpperCase(); }); }
function cmpTexto(a, b){ return String(a).localeCompare(String(b), 'es', { sensitivity: 'base' }); }

/* ---------- Fechas (cadenas AAAA-MM-DD; cálculo en UTC, sin husos horarios) ---------- */
function isoNum(iso){ var p = iso.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
function numIso(n){ var d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function sumarDias(iso, k){ return numIso(isoNum(iso) + k); }
function diaSemana(iso){ return (((isoNum(iso) + 3) % 7) + 7) % 7; }          // 0 = lunes … 6 = domingo
function lunesDe(iso){ return sumarDias(iso, -diaSemana(iso)); }
function inicioMes(iso){ return iso.slice(0, 7) + '-01'; }
function finMes(iso){ var p = iso.split('-'); return numIso(Math.round(Date.UTC(+p[0], +p[1], 0) / 86400000)); }
function mesAnterior(iso){ var p = iso.split('-'), y = +p[0], m = +p[1] - 1; if (m < 1){ m = 12; y--; } return y + '-' + pad(m) + '-01'; }
function esIso(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && numIso(isoNum(s)) === s; }
function rango(desde, hasta){ var out = [], a = isoNum(desde), b = isoNum(hasta); for (var i = a; i <= b; i++) out.push(numIso(i)); return out; }

function fmtFecha(iso){ var p = iso.split('-'); return pad(+p[2]) + '/' + pad(+p[1]) + '/' + p[0]; }
function fmtFechaLarga(iso){ var p = iso.split('-'); return DIAS_C[diaSemana(iso)] + ' ' + (+p[2]) + ' ' + MESES_C[+p[1] - 1] + ' ' + p[0]; }
function fmtDiaMes(iso){ var p = iso.split('-'); return (+p[2]) + ' ' + MESES_C[+p[1] - 1]; }
function nombreMes(iso){ var p = iso.split('-'); var m = MESES[+p[1] - 1]; return m.charAt(0).toUpperCase() + m.slice(1) + ' ' + p[0]; }
function etiquetaSemana(lunes){
  var dom = sumarDias(lunes, 6), a = lunes.split('-'), b = dom.split('-');
  return 'Semana del ' + (+a[2]) + ' ' + MESES_C[+a[1] - 1] + (a[0] !== b[0] ? ' ' + a[0] : '') + ' al ' + (+b[2]) + ' ' + MESES_C[+b[1] - 1] + ' ' + b[0];
}

/* ---------- Modelo ---------- */
function normalizarClasif(raw){
  var c = { orden: [], productos: {} };
  if (raw && typeof raw === 'object'){
    if (Array.isArray(raw.orden)) c.orden = raw.orden.slice();
    if (raw.productos && typeof raw.productos === 'object') c.productos = raw.productos;
  }
  if (!c.orden.length) c.orden = CFG.categoriasBase.slice();
  Object.keys(c.productos).forEach(function(k){ var cat = c.productos[k].c; if (cat && c.orden.indexOf(cat) < 0) c.orden.push(cat); });
  return c;
}
function prepararDia(fecha, d, clase){
  var nC = d.centros.length, filas = [], tot = { u: 0, c: 0 }, ex = { u: 0, c: 0 }, mus = { u: 0, c: 0 }, porCentro = d.centros.map(function(){ return { u: 0, c: 0 }; });
  (d.filas || []).forEach(function(r){
    var u = [], c = [], k = claveProducto(r[0]), cl = clase(k);
    for (var i = 0; i < nC; i++){
      var uu = +r[1 + 2 * i] || 0, cc = Math.round((+r[2 + 2 * i] || 0) * 100);
      u.push(uu); c.push(cc);
      if (cl === 'ex'){ ex.u += uu; ex.c += cc; }
      else if (cl === 'mus'){ mus.u += uu; mus.c += cc; }
      else { porCentro[i].u += uu; porCentro[i].c += cc; tot.u += uu; tot.c += cc; }
    }
    filas.push({ k: k, n: limpiarNombre(r[0]), u: u, c: c, ex: cl !== null, mus: cl === 'mus' });
  });
  return { fecha: fecha, centros: d.centros.slice(), filas: filas, tot: tot, excl: ex, mus: mus, porCentro: porCentro, archivo: d.archivo || '', cargado: d.cargado || '' };
}
function crearModelo(shards, clasifRaw){
  var clasif = normalizarClasif(clasifRaw), dias = {}, centros = [];
  var clase = function(k){ var p = clasif.productos[k]; return p && p.c === CFG.excluido ? 'ex' : (p && p.c === CFG.musicos ? 'mus' : null); };
  (shards || []).forEach(function(sh){
    var dd = (sh && sh.dias) || (sh && sh.datos && sh.datos.dias) || {};
    Object.keys(dd).forEach(function(f){ if (esIso(f) && dd[f] && Array.isArray(dd[f].centros)) dias[f] = prepararDia(f, dd[f], clase); });
  });
  var fechas = Object.keys(dias).sort();
  fechas.forEach(function(f){ dias[f].centros.forEach(function(c){ if (centros.indexOf(c) < 0) centros.push(c); }); });
  var cats = clasif.orden.filter(function(x){ return x !== CFG.excluido && x !== CFG.musicos; }); if (cats.indexOf(CFG.sinClasificar) < 0) cats.push(CFG.sinClasificar);
  var exU = 0, exC = 0, muU = 0, muC = 0; fechas.forEach(function(f){ exU += dias[f].excl.u; exC += dias[f].excl.c; muU += dias[f].mus.u; muC += dias[f].mus.c; });
  return { dias: dias, fechas: fechas, centros: centros, clasif: clasif, categorias: cats, excluidos: { u: exU, c: exC }, musicos: { u: muU, c: muC } };
}
function catDe(m, k){ var p = m.clasif.productos[k]; return p && p.c ? p.c : CFG.sinClasificar; }
function subDe(m, k){ var p = m.clasif.productos[k]; return p && p.s ? p.s : null; }

/* ---------- Agregación ---------- */
function agregar(m, fechas){
  var a = { fechas: fechas.filter(function(f){ return m.dias[f]; }), u: 0, c: 0, centros: {}, cats: {}, prods: {}, musicos: { u: 0, c: 0, prods: {} } };
  m.centros.forEach(function(c){ a.centros[c] = { u: 0, c: 0 }; });
  m.categorias.forEach(function(c){ a.cats[c] = { u: 0, c: 0 }; });
  a.fechas.forEach(function(f){
    var d = m.dias[f];
    d.filas.forEach(function(r){
      if (r.ex){
        if (r.mus){
          var mp = a.musicos.prods[r.k] || (a.musicos.prods[r.k] = { k: r.k, n: (m.clasif.productos[r.k] && m.clasif.productos[r.k].n) || r.n, u: 0, c: 0, centros: {} });
          for (var j = 0; j < d.centros.length; j++){ mp.u += r.u[j]; mp.c += r.c[j]; a.musicos.u += r.u[j]; a.musicos.c += r.c[j]; mp.centros[d.centros[j]] = (mp.centros[d.centros[j]] || 0) + r.u[j]; }
        }
        return;
      }
      var cat = catDe(m, r.k), p = a.prods[r.k];
      if (!p){ var def = m.clasif.productos[r.k]; p = a.prods[r.k] = { k: r.k, n: def && def.n ? def.n : r.n, cat: cat, sub: subDe(m, r.k), prov: def && def.v ? def.v : null, u: 0, c: 0, centros: {} }; }
      for (var i = 0; i < d.centros.length; i++){
        var cn = d.centros[i];
        p.u += r.u[i]; p.c += r.c[i];
        a.u += r.u[i]; a.c += r.c[i];
        a.centros[cn].u += r.u[i]; a.centros[cn].c += r.c[i];
        if (!a.cats[cat]) a.cats[cat] = { u: 0, c: 0 };
        a.cats[cat].u += r.u[i]; a.cats[cat].c += r.c[i];
        if (!p.centros[cn]) p.centros[cn] = { u: 0, c: 0 };
        p.centros[cn].u += r.u[i]; p.centros[cn].c += r.c[i];
      }
    });
  });
  return a;
}
/* Orden de los rankings: por unidades (o ventas), desempate por la otra magnitud y luego por nombre. */
function ordenar(lista, metrica){
  return lista.slice().sort(function(x, y){
    var p = metrica === 'c' ? (y.c - x.c) || (y.u - x.u) : (y.u - x.u) || (y.c - x.c);
    return p || cmpTexto(x.n, y.n);
  });
}
function ranking(a, categoria, metrica){
  var l = []; Object.keys(a.prods).forEach(function(k){ var p = a.prods[k]; if (!categoria || p.cat === categoria) l.push(p); });
  return ordenar(l, metrica || 'u');
}
function lista(obj, metrica){ return Object.keys(obj).map(function(k){ return { n: k, u: obj[k].u, c: obj[k].c }; }); }

/* Entradas agrupadas por proveedor (y dentro de cada uno, por tipo). Orden: ventas y luego unidades. */
function entradasPorProveedor(a){
  var provs = {}, tot = { u: 0, c: 0 };
  Object.keys(a.prods).forEach(function(k){
    var p = a.prods[k]; if (p.cat !== CFG.entradas) return;
    var nombre = p.prov || CFG.sinProveedor, o = provs[nombre] || (provs[nombre] = { n: nombre, u: 0, c: 0, tipos: {}, prods: [] });
    o.u += p.u; o.c += p.c; tot.u += p.u; tot.c += p.c; o.prods.push(p);
    var t = p.sub || 'Otras', x = o.tipos[t] || (o.tipos[t] = { n: t, u: 0, c: 0 }); x.u += p.u; x.c += p.c;
  });
  var lista = Object.keys(provs).map(function(k){ var o = provs[k]; o.tipos = Object.keys(o.tipos).map(function(t){ return o.tipos[t]; }).sort(function(x, y){ return (y.c - x.c) || (y.u - x.u) || cmpTexto(x.n, y.n); }); o.prods = ordenar(o.prods, 'c'); return o; })
    .sort(function(x, y){ return (y.c - x.c) || (y.u - x.u) || cmpTexto(x.n, y.n); });
  return { total: tot, lista: lista };
}
function listaMusicos(a){ return ordenar(Object.keys(a.musicos.prods).map(function(k){ return a.musicos.prods[k]; }), 'u'); }
function proveedoresConocidos(m){
  var out = []; Object.keys(m.clasif.productos).forEach(function(k){ var p = m.clasif.productos[k]; if (p.c === CFG.entradas && p.v && out.indexOf(p.v) < 0) out.push(p.v); });
  return out.sort(cmpTexto);
}

/* ---------- Periodos ---------- */
function ultimaFecha(m){ return m.fechas.length ? m.fechas[m.fechas.length - 1] : null; }
function primeraFecha(m){ return m.fechas.length ? m.fechas[0] : null; }
function cargados(m, desde, hasta){ return m.fechas.filter(function(f){ return f >= desde && f <= hasta; }); }

/* per = { modo: 'dia'|'semana'|'mes'|'todo'|'rango', ref, desde, hasta } */
function resolverPeriodo(m, per){
  var ult = ultimaFecha(m), prim = primeraFecha(m), desde, hasta, etiqueta, sust, pasado;
  if (!ult) return { modo: per.modo, vacio: true, fechas: [], etiqueta: '', sust: 'periodo' };
  switch (per.modo){
    case 'dia':    desde = hasta = per.ref; etiqueta = fmtFechaLarga(per.ref); sust = 'día'; break;
    case 'semana': desde = lunesDe(per.ref); hasta = sumarDias(desde, 6); etiqueta = etiquetaSemana(desde); sust = 'semana'; break;
    case 'mes':    desde = inicioMes(per.ref); hasta = finMes(per.ref); etiqueta = nombreMes(per.ref); sust = 'mes'; break;
    case 'rango':  desde = per.desde; hasta = per.hasta; if (desde > hasta){ var t = desde; desde = hasta; hasta = t; }
                   etiqueta = fmtFecha(desde) + ' – ' + fmtFecha(hasta); sust = 'periodo'; break;
    default:       desde = prim; hasta = ult; etiqueta = 'Todo el histórico'; sust = 'periodo';
  }
  var hastaEf = hasta > ult ? ult : hasta;          // un periodo en curso se mide "hasta hoy"
  var enCurso = hasta > ult;
  var fechas = cargados(m, desde, hastaEf);
  var nEsp = hastaEf >= desde ? isoNum(hastaEf) - isoNum(desde) + 1 : 0;
  return { modo: per.modo, desde: desde, hasta: hasta, hastaEf: hastaEf, enCurso: enCurso, fechas: fechas, nEsperados: nEsp,
           etiqueta: etiqueta, sust: sust, faltan: Math.max(0, nEsp - fechas.length) };
}
/* Periodo con el que se compara: mismo día de la semana anterior · semana anterior · mes anterior · tramo anterior de igual duración. */
function periodoComparable(m, p){
  if (p.vacio || p.modo === 'todo' || !p.fechas.length) return null;
  var desde, hasta, etiqueta;
  if (p.modo === 'dia'){ desde = hasta = sumarDias(p.desde, -7); etiqueta = 'el ' + fmtFechaLarga(desde); }
  else if (p.modo === 'semana'){ desde = sumarDias(p.desde, -7); hasta = sumarDias(p.hastaEf, -7); etiqueta = 'la semana anterior'; }
  else if (p.modo === 'mes'){
    desde = mesAnterior(p.desde);
    var finPrev = finMes(desde);
    if (p.hastaEf === finMes(p.desde)) hasta = finPrev;
    else { var dd = +p.hastaEf.slice(8); hasta = desde.slice(0, 8) + pad(dd); if (hasta > finPrev) hasta = finPrev; }
    etiqueta = 'el mes anterior';
  } else {                                           // rango
    var len = isoNum(p.hastaEf) - isoNum(p.desde) + 1;
    desde = sumarDias(p.desde, -len); hasta = sumarDias(p.desde, -1); etiqueta = 'el tramo anterior (' + len + ' días)';
  }
  var fechas = cargados(m, desde, hasta), nEsp = isoNum(hasta) - isoNum(desde) + 1;
  return { desde: desde, hasta: hasta, fechas: fechas, nEsperados: nEsp, completo: fechas.length === nEsp, etiqueta: etiqueta };
}

/* ---------- Evolución ---------- */
function serieDiaria(m, desde, hasta){
  return rango(desde, hasta).map(function(f){
    var d = m.dias[f];
    if (!d) return { fecha: f, tiene: false, u: 0, c: 0, centros: {}, centrosU: {}, cats: {}, catsU: {}, prov: {}, provU: {} };
    var s = { fecha: f, tiene: true, u: d.tot.u, c: d.tot.c, centros: {}, centrosU: {}, cats: {}, catsU: {}, prov: {}, provU: {} };
    d.centros.forEach(function(cn, i){ s.centros[cn] = d.porCentro[i].c; s.centrosU[cn] = d.porCentro[i].u; });
    d.filas.forEach(function(r){
      if (r.ex) return;
      var cat = catDe(m, r.k), tc = 0, tu = 0;
      for (var i = 0; i < r.c.length; i++){ tc += r.c[i]; tu += r.u[i]; }
      s.cats[cat] = (s.cats[cat] || 0) + tc; s.catsU[cat] = (s.catsU[cat] || 0) + tu;
      if (cat === CFG.entradas){ var df = m.clasif.productos[r.k], pv = (df && df.v) || CFG.sinProveedor; s.prov[pv] = (s.prov[pv] || 0) + tc; s.provU[pv] = (s.provU[pv] || 0) + tu; }
    });
    return s;
  });
}
function mediaPorDiaSemana(serie){
  var acc = [0, 1, 2, 3, 4, 5, 6].map(function(){ return { n: 0, c: 0, u: 0 }; });
  serie.forEach(function(s){ if (s.tiene){ var w = acc[diaSemana(s.fecha)]; w.n++; w.c += s.c; w.u += s.u; } });
  return acc.map(function(w, i){ return { dia: DIAS_L[i], corto: DIAS_C[i], n: w.n, c: w.n ? w.c / w.n : 0, u: w.n ? w.u / w.n : 0 }; });
}
function diasSinDatos(m){

function numEs(s){                // "1.234,50" -> 1234.5 ; null si no es un número

function r2(x){ return Math.round(x * 100) / 100; }
/* Algunos programas escriben el XML con prefijos (<x:sheet>, <x:c>…): se quitan para leerlo igual */
function sinPrefijo(x){ return String(x).replace(/<(\/?)[A-Za-z][\w.-]*:([A-Za-z][\w.-]*)/g, '<$1$2'); }

/* Número en formato español («1.234,50») o inglés («1,944.80 €»); null si no es un número */

/* Rutas del paquete .xlsx que hay que leer (el resto no hace falta) */

function leerLibro(f){
  var wb = f['xl/workbook.xml'], rel = f['xl/_rels/workbook.xml.rels'];

  var ruta = null, nombreHoja = '';

    var hoja = hojas.filter(function(h){ return /ventas|producto/i.test(h.nombre); })[0] || hojas[0];

    var r = rels.filter(function(x){ return x.id === hoja.rid; })[0];

    if (!ks.length) throw new Error(hojas.length ? 'Falta el contenido de la hoja dentro del Excel.' : 'El Excel no tiene hojas.');

/* Informe «Ventas por Productos por Centro de Venta»: centros, productos (uds. y ventas) y fila Total */
function leerVentas(h){
  var get = function(f, c){ var v = h.celdas[f + ':' + c]; return v === undefined ? null : v; };
  var txt = function(f, c){ var v = get(f, c); return v === null ? '' : String(v); };
  var sub = 0, pares = [], etiquetas = null, f, c;
  for (f = 1; f <= Math.min(h.maxF, 15) && !sub; f++){          // formato A: una fila de centros y debajo «Cant.» / «Ventas»
    for (c = 1; c < h.maxC; c++) if (/^cant/i.test(txt(f, c)) && /^ventas?/i.test(txt(f, c + 1))) pares.push(c);
    if (pares.length) sub = f;
  }
  for (f = 1; f <= Math.min(h.maxF, 25) && !sub; f++){          // formatos B y C: una sola fila «Producto | Barra Cant. | Barra Ventas | Puerta Cant. | …»
    if (!/^producto/i.test(txt(f, 1))) continue;
    var ps = [], et = [];
    for (c = 2; c < h.maxC; c++){
      var a1 = /^(.*?)\s*cant(?:idad)?\.?$/i.exec(txt(f, c)), b1 = /^(.*?)\s*ventas?\b/i.exec(txt(f, c + 1));
      if (a1 && b1 && a1[1].trim() && limpiarTxt(a1[1]).toLowerCase() === limpiarTxt(b1[1]).toLowerCase()){ ps.push(c); et.push(limpiarTxt(a1[1])); c++; }
    }
    if (ps.length){ sub = f; pares = ps; etiquetas = et; }
  }
  if (!sub) throw new Error('No encuentro las columnas «Cant.» y «Ventas» de cada centro. ¿Es el informe «Ventas por Productos por Centro de Venta» de Ágora?');
  var centros = pares.map(function(col, i){
    if (etiquetas) return T.nombreCentro(etiquetas[i]);
    var cc = col, lab = ''; while (cc >= 1 && sub > 1 && !(lab = txt(sub - 1, cc))) cc--;
    return T.nombreCentro(lab || ('Centro ' + (i + 1)));
  });
  var nom = {}, filas = [], total = null, avisos = [], errores = [];
  var num = function(f, c){
    var v = get(f, c); if (v === null) return 0;
    if (typeof v === 'number') return v;
    var n = numFlex(v); if (n === null){ errores.push('Fila ' + f + ': «' + v + '» no es un número.'); return 0; } return n;
  };
  for (f = sub + 1; f <= h.maxF; f++){
    var nombre = limpiarTxt(txt(f, 1));
    if (!nombre) continue;
    if (/^total(es)?$/i.test(nombre)){ total = pares.map(function(col){ return { u: num(f, col), c: num(f, col + 1) }; }); break; }
    var vals = pares.map(function(col){ return { u: num(f, col), c: num(f, col + 1) }; });
    if (vals.every(function(x){ return !x.u && !x.c; })) continue;
    var k = T.claveProducto(nombre);
    if (nom[k]){ vals.forEach(function(x, i){ nom[k].v[i].u += x.u; nom[k].v[i].c += x.c; }); avisos.push('«' + nombre + '» aparece más de una vez: se han sumado.'); }
    else { nom[k] = { n: nombre, k: k, v: vals }; filas.push(nom[k]); }
  }
  if (errores.length) throw new Error(errores.slice(0, 5).join('\n'));
  if (!filas.length) throw new Error('No hay productos en el archivo.');
  var suma = pares.map(function(_, i){ return filas.reduce(function(s, r){ return { u: s.u + r.v[i].u, c: s.c + Math.round(r.v[i].c * 100) }; }, { u: 0, c: 0 }); });
  var difs = [];
  if (total) total.forEach(function(t, i){
    if (Math.abs(suma[i].u - t.u) > 0.001) difs.push(centros[i] + ': unidades ' + T.fmtNum(suma[i].u) + ' en las filas frente a ' + T.fmtNum(t.u) + ' en la fila Total.');
    if (Math.abs(suma[i].c / 100 - t.c) > 0.05) difs.push(centros[i] + ': ventas ' + T.fmtEur(suma[i].c) + ' en las filas frente a ' + T.fmtEur(Math.round(t.c * 100)) + ' en la fila Total.');
  });
  else avisos.push('El archivo no trae fila «Total»: no se puede comprobar que las cifras cuadren.');
  return { centros: centros, filas: filas, suma: suma, total: total, difs: difs, avisos: avisos, fechaContenido: fechaDeContenido(h), formato: etiquetas ? 'B/C' : 'A' };
}

/* Fecha escrita DENTRO del informe ("Desde 28/08/2026", título "Ventas 05-01-2026"). Vacío si el informe no la trae. */
function fechaDeContenido(h){
  var f, c, v, w, k, r;
  for (f = 1; f <= Math.min(h.maxF, 15); f++) for (c = 1; c <= h.maxC; c++){
    v = h.celdas[f + ':' + c]; if (typeof v !== 'string' || !/^desde\b/i.test(v.trim())) continue;
    if ((r = fechaDeTexto(v))) return r;
    for (k = c + 1; k <= Math.min(c + 3, h.maxC); k++){ w = h.celdas[f + ':' + k]; if (w === null || w === undefined) continue; r = typeof w === 'number' ? serialAFecha(w) : fechaDeTexto(w); if (r) return r; }
  }
  for (f = 1; f <= Math.min(h.maxF, 3); f++) for (c = 1; c <= Math.min(h.maxC, 4); c++){ v = h.celdas[f + ':' + c]; if (typeof v === 'string' && /^ventas\b/i.test(v.trim()) && (r = fechaDeTexto(v))) return r; }

/* Fecha: del nombre del archivo ("01 DE ENERO", "20 DESEPTIEMBRE", "2026-01-05", "05-01-2026").
   Sin año, se deduce con la fecha de exportación (o, si no hay, con hoy). */
function fechaDeNombre(nombre, ref0, hoy){
  var s = String(nombre).replace(/\.[a-z0-9]+$/i, '').replace(/[_]+/g, ' ').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(), m;
  if ((m = /(\d{4})[-.\/ ](\d{1,2})[-.\/ ](\d{1,2})/.exec(s))) return isoFecha(+m[1], +m[2], +m[3]);

    mo = meses.indexOf(m[2] === 'setiembre' ? 'septiembre' : m[2]) + 1; d = +m[1]; anio = m[3] ? +m[3] : 0;
  } else {                          // mes mal escrito («AGSOTO», «SEPTIMBRE»): vale si solo se diferencia en una letra de uno de los meses
    var rx = /(\d{1,2})\s*(?:de\s*)?([a-z]{4,12})(?:\s*(?:de\s*)?(\d{4}))?/g, mm;
    while (!mo && (mm = rx.exec(s))){ var cercanos = meses.concat(['setiembre']).filter(function(n){ return cerca1(mm[2], n); }); if (cercanos.length === 1){ mo = meses.indexOf(cercanos[0] === 'setiembre' ? 'septiembre' : cercanos[0]) + 1; d = +mm[1]; anio = mm[3] ? +mm[3] : 0; } }
  }
  if (!mo) return '';
  if (anio) return isoFecha(anio, mo, d);
  // Sin año en el nombre: el del archivo más reciente que no sea anterior a esa fecha (el informe de un día se exporta ese día o los siguientes)
  var ref = ref0 || hoy, y = +ref.slice(0, 4), cand = isoFecha(y, mo, d);
  if (cand && cand > T.sumarDias(ref, 2)) cand = isoFecha(y - 1, mo, d);
  if (cand && hoy && cand > T.sumarDias(hoy, 1)) cand = isoFecha(y - 1, mo, d);
  return cand;

/* La mayor de las fechas que sirven de pista (modificación del archivo en Drive, fecha interna del Excel) */
function refAnio(a, b){ return [a, b].filter(function(x){ return /^\d{4}-\d{2}-\d{2}$/.test(x || ''); }).sort().pop() || null; }
/* Fecha final del día: la del contenido manda; si el nombre dice otro día, hay conflicto y se avisa */
function resolverFecha(nombre, ref, hoy, fechaContenido){
  var n = fechaDeNombre(nombre, ref, hoy);
  if (fechaContenido){
    var conflicto = !!n && n.slice(5) !== fechaContenido.slice(5);
    return { fecha: fechaContenido, conflicto: conflicto, aviso: conflicto ? 'El nombre del archivo dice el ' + n.slice(8) + '/' + n.slice(5, 7) + ' pero el contenido del informe dice el ' + fechaContenido.slice(8) + '/' + fechaContenido.slice(5, 7) + '.' : '' };
  }

/* ---------- Clasificación sugerida ---------- */
var STOP = { CON: 1, SIN: 1, DEL: 1, LAS: 1, LOS: 1, UNA: 1, UNIDADES: 1, UD: 1, COPA: 1, CERVEZA: 1, CERVEZAS: 1, REFRESCO: 1, REFRESCOS: 1, CENA: 1, PASE: 1 };   // palabras demasiado genéricas para comparar

  var out = [];
  Object.keys(productos).forEach(function(k){ var p = productos[k]; if (p.c === T.CFG.entradas && p.v && out.indexOf(p.v) < 0) out.push(p.v); });

/* productos: mapa clave → {n,c,s,v}. extra: proveedores ya decididos en esta sesión.

function sugerir(nombre, productos, extra){
  var k = T.claveProducto(nombre);
  if (/MUSICO/.test(k)) return { c: T.CFG.musicos, s: null, v: null, sug: true, alta: true };
  if (/CUPON|CORTESIA|CONSUMICION/.test(k)) return { c: T.CFG.excluido, s: null, v: null, sug: true, alta: true };
  if (/^ENTRADA\b/.test(k)) return { c: T.CFG.entradas, s: tipoEntrada(k), v: 'Taquilla', sug: true, alta: true };

  var prov = proveedoresDe(productos, extra).filter(function(p){ return T.claveProducto(p) === primero; })[0];
  if (prov && resto && /COPA|CERVEZA|REFRESCO|PASE|CENA/.test(k)) return { c: T.CFG.entradas, s: tipoEntrada(k), v: prov, sug: true, alta: true };

    var p = productos[k2]; if (p.c === T.CFG.excluido || p.c === T.CFG.musicos || p.c === T.CFG.entradas) return;
    var t2 = tokens(k2); if (!t2.length) return;

}

function abB64(buf){
  var b = new Uint8Array(buf), s = '';
  for (var i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
var limpiarTxt = ING.limpiarTxt;

/* ============================ LECTURA DEL EXCEL (módulo común ING) ============================ */
async function parseExcel(buf){
  var zip;
  try { zip = await JSZip.loadAsync(buf); } catch (e){ throw new Error('El archivo no es un Excel (.xlsx) válido.'); }
  var dic = {}, nombres = Object.keys(zip.files).filter(ING.rutasNecesarias);
  for (var i = 0; i < nombres.length; i++) dic[nombres[i]] = await zip.file(nombres[i]).async('string');
  return ING.leerLibro(dic);
}
function leerVentas(h){ return ING.leerVentas(h); }
function fechaDeNombre(nombre, exportado){ return ING.fechaDeNombre(nombre, exportado, hoyIso()); }

/* ============================ CLASIFICACIÓN ============================ */
function categoriasDisponibles(){
  var c = S.m ? S.m.clasif.orden.slice() : T.CFG.categoriasBase.slice();
  S.extraCats.forEach(function(x){ if (c.indexOf(x) < 0) c.push(x); });
  c = c.filter(function(x){ return x !== T.CFG.excluido && x !== T.CFG.musicos; });
  return c.concat([T.CFG.musicos, T.CFG.excluido]);
}
function decisiones(){ return [S.dec, S.pdec, S.edits]; }
function proveedoresTodos(){
  var extra = []; decisiones().forEach(function(b){ Object.keys(b).forEach(function(k){ if (b[k] && b[k].c === T.CFG.entradas && b[k].v) extra.push(b[k].v); }); });
  return ING.proveedoresDe(S.m ? S.m.clasif.productos : {}, extra).sort(T.cmpTexto);
}
function subsDe(cat){
  var out = []; if (!S.m) return out;
  Object.keys(S.m.clasif.productos).forEach(function(k){ var p = S.m.clasif.productos[k]; if (p.c === cat && p.s && out.indexOf(p.s) < 0) out.push(p.s); });
  decisiones().forEach(function(b){ Object.keys(b).forEach(function(k){ var p = b[k]; if (p && p.c === cat && p.s && out.indexOf(p.s) < 0) out.push(p.s); }); });
  if (cat === T.CFG.entradas) ['Copa', 'Cerveza/refresco', 'Pase cena', 'Entrada'].forEach(function(t){ if (out.indexOf(t) < 0) out.push(t); });
  return out.sort(T.cmpTexto);
}
function sugerir(nombre){ return ING.sugerir(nombre, S.m ? S.m.clasif.productos : {}, proveedoresTodos()); }
/* Productos que están en los datos pero no en la clasificación (llegan solos desde el script de Google) */
function pendientesDeDatos(){
  if (!S.m) return [];
  var vistos = {}, out = [];
  S.m.fechas.forEach(function(f){ S.m.dias[f].filas.forEach(function(r){
    if (S.m.clasif.productos[r.k]) return;
    var o = vistos[r.k] || (vistos[r.k] = { k: r.k, n: r.n, u: 0 }); if (!vistos[r.k].listo){ vistos[r.k].listo = true; out.push(o); }
    r.u.forEach(function(x){ o.u += x; });
  }); });
  return out.sort(function(a, b){ return b.u - a.u; });
}

/* ============================ PROCESO DE ARCHIVOS ============================ */
var idSeq = 0;
async function procesarArchivos(files){
  S.exito = null; S.ocupado = true; pintar();
  for (var i = 0; i < files.length; i++){
    var f = files[i], it = { id: ++idSeq, nombre: f.name, tam: f.size, error: null };
    try {
      if (!/\.xlsx$/i.test(f.name)) throw new Error('Tiene que ser un Excel .xlsx (no .xls ni otros formatos).');
      it.buffer = await f.arrayBuffer();
      var h = await parseExcel(it.buffer), v = leerVentas(h, f.name);
      it.exportado = h.exportado; var mod = f.lastModified ? new Date(f.lastModified).toISOString().slice(0, 10) : null, rf = ING.resolverFecha(f.name, ING.refAnio(mod, h.exportado), hoyIso(), v.fechaContenido);
      it.fecha = rf.fecha; it.fechaAuto = !!it.fecha; if (rf.aviso) v.avisos.push(rf.aviso + ' Se ha puesto la fecha del contenido.');
      it.centros = v.centros; it.filas = v.filas; it.suma = v.suma; it.total = v.total; it.difs = v.difs; it.avisos = v.avisos;
    } catch (e){ it.error = e && e.message ? e.message : String(e); }
    S.items.push(it);
  }
  S.ocupado = false; recalcular(); pintar();
}
function validos(){ return S.items.filter(function(it){ return !it.error; }); }
function recalcular(){
  var nuevos = {};
  validos().forEach(function(it){
    it.filas.forEach(function(r){
      if (S.m && S.m.clasif.productos[r.k]) return;
      var n = nuevos[r.k] || (nuevos[r.k] = { k: r.k, n: r.n, u: 0 });
      r.v.forEach(function(x){ n.u += x.u; });
    });
  });
  Object.keys(nuevos).forEach(function(k){ if (!S.dec[k]){ var sg = sugerir(nuevos[k].n); if (sg) S.dec[k] = sg; } });
  Object.keys(S.dec).forEach(function(k){ if (!nuevos[k]) delete S.dec[k]; });
  S.nuevos = Object.keys(nuevos).map(function(k){ return nuevos[k]; }).sort(function(a, b){ return b.u - a.u; });
}
function problemas(){
  var p = [], v = validos(), fechas = {};
  if (!v.length) return ['Sube al menos un Excel válido.'];
  v.forEach(function(it){
    if (!it.fecha) p.push('«' + it.nombre + '»: indica la fecha de las ventas.');
    else { if (fechas[it.fecha]) p.push('Dos archivos tienen la misma fecha (' + T.fmtFecha(it.fecha) + ').'); fechas[it.fecha] = 1; }
    if (it.difs.length) p.push('«' + it.nombre + '»: las cifras no cuadran con la fila Total de Ágora.');
  });
  var sinClas = S.nuevos.filter(function(n){ return !S.dec[n.k] || !S.dec[n.k].c; }).length;
  if (sinClas) p.push('Falta elegir la categoría de ' + sinClas + ' ' + plural(sinClas, 'producto nuevo', 'productos nuevos') + '.');
  var sinProv = S.nuevos.filter(function(n){ var d = S.dec[n.k]; return d && d.c === T.CFG.entradas && !d.v; }).length;
  if (sinProv) p.push('Falta elegir el proveedor de ' + sinProv + ' ' + plural(sinProv, 'entrada nueva', 'entradas nuevas') + '.');
  if (S.nuevos.some(function(n){ return S.dec[n.k] && S.dec[n.k].sug; }) && !S.revisado) p.push('Marca que has revisado las categorías sugeridas.');
  return p;
}

/* ============================ PUBLICAR ============================ */
async function llamar(accion, datos){
  var ses = getSes();
  try { return await API.accion(accion, datos, ses ? ses.token : null); }
  catch (e){
    if (e && e.codigo === 'SESION'){ limpiarSes(); S.ocupado = false; S.pub = null; e.silencioso = true; pintarLogin('Tu sesión ha caducado. Vuelve a entrar.'); }
    throw e;
  }
}
function paso(txt){ S.pub.pasos.push(txt); pintarPublicacion(); }
async function publicar(){
  var v = validos().slice().sort(function(a, b){ return a.fecha < b.fecha ? -1 : 1; });
  S.pub = { pasos: [], estado: 'trabajando' }; S.ocupado = true; pintar();
  try {
    var nuevos = S.nuevos.filter(function(n){ return S.dec[n.k] && S.dec[n.k].c; });
    var clasif = nuevos.map(function(n){ var d = S.dec[n.k], p = { k: n.k, n: n.n, c: d.c, s: d.s || null }; if (d.v) p.v = d.v; return p; });
    var ahora = new Date().toISOString(), meses = {};
    v.forEach(function(it){ (meses[it.fecha.slice(0, 7)] = meses[it.fecha.slice(0, 7)] || []).push(it); });
    var primero = true;
    for (var mes in meses){
      var its = meses[mes];
      await llamar('publicar', {
        clasif: primero ? clasif : [],
        dias: its.map(function(it){ return { fecha: it.fecha, dia: ING.construirDia(it, it.nombre, ahora) }; }),
        originales: its.map(function(it){ return { fecha: it.fecha, b64: abB64(it.buffer) }; })
      });
      if (primero && clasif.length) paso('Clasificación guardada (' + clasif.length + ' ' + plural(clasif.length, 'producto nuevo', 'productos nuevos') + ').');
      primero = false;
      paso('Mes ' + mes + ' guardado (' + its.length + ' ' + plural(its.length, 'día', 'días') + ', con la copia de los Excel originales).');
    }
    S.exito = { dias: v.map(function(it){ return { fecha: it.fecha, ventas: it.suma.reduce(function(s, x){ return s + x.c; }, 0) }; }), nuevos: nuevos.length };
    S.items = []; S.dec = {}; S.revisado = false; S.pub = null;
    await recargar();
  } catch (e){
    if (e && e.silencioso) return;
    S.pub = { pasos: S.pub ? S.pub.pasos : [], estado: 'error', error: e && e.message ? e.message : String(e) };
  }
  S.ocupado = false; pintar();
}
async function recargar(){
  var ses = getSes();
  try { S.datos = await API.ventas(ses ? ses.token : ''); }
  catch (e){
    if (e && e.codigo === 'SESION'){ limpiarSes(); S.ocupado = false; S.pub = null; e.silencioso = true; pintarLogin('Tu sesión ha caducado. Vuelve a entrar.'); }
    throw e;
  }
  S.m = T.crearModelo(S.datos.shards, S.datos.clasif); S.edits = {};
}
async function borrarDia(fecha){
  S.ocupado = true; S.msg = null; pintar();
  try {
    await llamar('borrarDia', { fecha: fecha });
    S.confBorrar = null; await recargar(); S.msg = { t: 'ok', x: 'Se ha borrado el día ' + T.fmtFecha(fecha) + '.' };
  } catch (e){ if (e && e.silencioso) return; S.msg = { t: 'err', x: e.message }; }
  S.ocupado = false; pintar();
}
async function guardarClasificacion(){
  var claves = Object.keys(S.edits); if (!claves.length) return;
  S.ocupado = true; S.msg = null; pintar();
  try {
    await llamar('clasificar', { cambios: claves.map(function(k){ var e = S.edits[k], p = S.m.clasif.productos[k] || {}; return { k: k, n: p.n || k, c: e.c, s: e.s || null, v: e.v || null }; }) });
    await recargar(); S.msg = { t: 'ok', x: 'Clasificación guardada (' + claves.length + ' ' + plural(claves.length, 'cambio', 'cambios') + '). El panel de socios ya recalcula con ella.' };
  } catch (e){ if (e && e.silencioso) return; S.msg = { t: 'err', x: e.message }; }
  S.ocupado = false; pintar();
}
async function guardarPendientes(){
  var pend = pendientesDeDatos(), listos = pend.filter(function(p){ var d = S.pdec[p.k]; return d && d.c && (d.c !== T.CFG.entradas || d.v); });
  if (!listos.length) return;
  S.ocupado = true; S.msg = null; pintar();
  try {
    await llamar('clasificar', { cambios: listos.map(function(p){ var d = S.pdec[p.k]; return { k: p.k, n: p.n, c: d.c, s: d.s || null, v: d.v || null }; }) });
    listos.forEach(function(p){ delete S.pdec[p.k]; }); S.revisadoPend = false;
    await recargar(); S.msg = { t: 'ok', x: 'Clasificados ' + listos.length + ' ' + plural(listos.length, 'producto', 'productos') + '. El panel de socios ya los recalcula.' };
  } catch (e){ if (e && e.silencioso) return; S.msg = { t: 'err', x: e.message }; }
  S.ocupado = false; pintar();
}

/* ============================ ACCESO DE LOS SOCIOS (una contraseña común, la fija Jorge) ============================ */
async function cargarClave(){
  S.ocupado = true; pintar();
  try { S.clave = await llamar('clave', { op: 'estado' }); }
  catch (e){ if (e && e.silencioso) return; S.msg = { t: 'err', x: e.message }; S.clave = S.clave || { fijada: false }; }
  S.ocupado = false; pintar();
}
async function opClave(datos, texto){
  S.ocupado = true; S.msg = null; pintar();
  try { S.clave = await llamar('clave', datos); if (texto) S.msg = { t: 'ok', x: texto }; S.claveA = ''; S.claveB = ''; }
  catch (e){ if (e && e.silencioso) return; S.msg = { t: 'err', x: e.message }; }
  S.ocupado = false; S.confQuitar = false; pintar();
}
function guardarClave(){
  var a = (document.getElementById('claveNueva') || {}).value || '', b = (document.getElementById('claveRepite') || {}).value || '';
  S.claveA = a; S.claveB = b;       // si hay un error, lo escrito se conserva para corregirlo
  if (!a.trim()) { S.msg = { t: 'err', x: 'Escribe la contraseña.' }; return pintar(); }
  if (a !== b){ S.msg = { t: 'err', x: 'Las dos contraseñas no coinciden.' }; return pintar(); }
  opClave({ op: 'fijar', clave: a }, 'Contraseña guardada. Los socios que ya estaban dentro tendrán que escribir la nueva.');
}

/* ============================ PANTALLAS ============================ */
function selCategoria(valor, attrs){
  return '<select class="sel" ' + attrs + ' aria-label="Categoría"><option value="">Elige categoría…</option>' +
    categoriasDisponibles().map(function(c){ return '<option value="' + esc(c) + '"' + (c === valor ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '<option value="' + NUEVA + '">+ Nueva categoría…</option></select>';
}
function selTipo(cat, valor, attrs){
  var subs = subsDe(cat); if (!cat || cat === T.CFG.excluido || cat === T.CFG.musicos) return '';
  if (!subs.length && !valor) return '';
  return '<select class="sel" ' + attrs + ' aria-label="Tipo"><option value="">(sin tipo)</option>' + subs.map(function(s){ return '<option value="' + esc(s) + '"' + (s === valor ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '<option value="' + NUEVA + '">+ Nuevo tipo…</option></select>';
}
function selProv(cat, valor, attrs){
  if (cat !== T.CFG.entradas) return '';
  return '<select class="sel" ' + attrs + ' aria-label="Proveedor"><option value="">Elige proveedor…</option>' + proveedoresTodos().map(function(p){ return '<option value="' + esc(p) + '"' + (p === valor ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '<option value="' + NUEVA + '">+ Nuevo proveedor…</option></select>';

/* pref: 'd' producto nuevo de un archivo · 'p' pendiente de los datos · 'e' producto ya clasificado */
function filaClas(pref, k, nombre, nota, d, clase){
  var at = function(campo){ return 'data-f="' + pref + campo + '" data-k="' + esc(k) + '"'; };
  var falta = !d.c || (d.c === T.CFG.entradas && !d.v);
  return '<li class="' + (clase || '') + (falta && pref !== 'e' ? ' falta' : '') + '"><div class="clas-n"><b>' + esc(nombre) + '</b>' + (nota ? '<small>' + nota + '</small>' : '') + '</div><div class="clas-s">' +
    selCategoria(d.c || '', at('cat')) + selProv(d.c, d.v || '', at('prov')) + selTipo(d.c, d.s || '', at('sub')) + '</div></li>';
}
function tarjetaArchivo(it){
  var h = '<div class="archivo' + (it.error ? ' mal' : '') + '"><div class="arch-cab"><b>' + esc(it.nombre) + '</b><button type="button" class="btn claro peq" data-act="quitar" data-v="' + it.id + '">Quitar</button></div>';
  if (it.error) return h + '<div class="aviso err">' + esc(it.error) + '</div></div>';
  var uds = it.suma.reduce(function(s, x){ return s + x.u; }, 0), eur = it.suma.reduce(function(s, x){ return s + x.c; }, 0);
  var cup = 0, mus = 0; it.filas.forEach(function(r){ var cl = S.m && S.m.clasif.productos[r.k], c = cl ? cl.c : (S.dec[r.k] && S.dec[r.k].c); if (c === T.CFG.excluido) r.v.forEach(function(x){ cup += x.u; }); else if (c === T.CFG.musicos) r.v.forEach(function(x){ mus += x.u; }); });
  h += '<div class="arch-cuerpo"><div><label for="f' + it.id + '">Fecha de las ventas</label><input class="campo" type="date" id="f' + it.id + '" data-f="fecha" data-id="' + it.id + '" value="' + esc(it.fecha || '') + '">' +
    '<small class="peq-txt">' + (it.fecha ? (it.fechaAuto ? 'Detectada por el nombre del archivo.' : 'Fecha indicada por ti.') : 'No se ha podido detectar: elígela.') + '</small></div>' +
    '<ul class="arch-datos"><li><b>' + it.filas.length + '</b> productos</li><li><b>' + T.fmtEur(eur) + '</b> en ventas</li><li><b>' + T.fmtNum(uds) + '</b> unidades' + ((cup || mus) ? ' (de ellas ' + [cup ? T.fmtNum(cup) + ' de cupones' : '', mus ? T.fmtNum(mus) + ' de músicos' : ''].filter(Boolean).join(' y ') + ', que no se cuentan en las ventas)' : '') + '</li><li>Centros: ' + it.centros.map(esc).join(', ') + '</li></ul></div>';
  if (it.total && !it.difs.length) h += '<div class="aviso ok">Las cifras cuadran con la fila Total de Ágora.</div>';
  it.difs.forEach(function(d){ h += '<div class="aviso err"><b>No cuadra.</b> ' + esc(d) + '</div>'; });
  it.avisos.forEach(function(a){ h += '<div class="aviso warn">' + esc(a) + '</div>'; });
  if (it.fecha && S.m && S.m.dias[it.fecha]) h += '<div class="aviso warn">Ya hay datos del ' + T.fmtFechaLarga(it.fecha) + ' (' + T.fmtEur(S.m.dias[it.fecha].tot.c) + '). Al publicar se <b>reemplazarán</b>.</div>';
  if (it.exportado && it.fecha && it.fecha > it.exportado) h += '<div class="aviso warn">El archivo se exportó el ' + T.fmtFecha(it.exportado) + ', antes de la fecha elegida. Revisa la fecha.</div>';
  return h + '</div>';
}

function ligarZona(){
  var z = document.getElementById('zona'), inp = document.getElementById('archivos'); if (!z) return;

  ['dragleave', 'drop'].forEach(function(ev){ z.addEventListener(ev, function(e){ e.preventDefault(); z.classList.remove('sobre'); }); });
  z.addEventListener('drop', function(e){ var f = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []); if (f.length) procesarArchivos(f); });

    var r = await API.accion('login', { nombre: ADMIN, codigo: cod.trim() });

  } catch (e){ pintarLogin(e.message); }

document.addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('[data-act]') : null; if (!b || b.disabled) return;
  var a = b.dataset.act, v = b.dataset.v;
  if (a === 'entrar') return entrar();
  if (a === 'salir'){ limpiarSes(); return pintarLogin(); }
  if (a === 'tab'){ S.tab = v; S.msg = null; S.confBorrar = null; S.confQuitar = false; S.claveA = ''; S.claveB = ''; pintar(); if (v === 'acceso') cargarClave(); return; }
  if (a === 'clave-guardar') return guardarClave();
  if (a === 'clave-quitar'){ S.confQuitar = true; return pintar(); }
  if (a === 'clave-quitar-no'){ S.confQuitar = false; return pintar(); }
  if (a === 'clave-quitar-si') return opClave({ op: 'quitar' }, 'Acceso de los socios quitado: nadie puede entrar hasta que fijes una contraseña.');
  if (a === 'copiar-url'){ try { navigator.clipboard.writeText(urlPanel()); b.textContent = 'Copiado ✓'; } catch (e){ b.textContent = 'Selecciona y copia la dirección'; } return; }
  if (a === 'quitar'){ S.items = S.items.filter(function(i){ return String(i.id) !== v; }); recalcular(); return pintar(); }
  if (a === 'publicar') return publicar();
  if (a === 'cerrar-pub'){ S.pub = null; return pintar(); }
  if (a === 'ver-todas'){ S.verTodas = true; return pintar(); }
  if (a === 'guardar-clas') return guardarClasificacion();
  if (a === 'guardar-pend') return guardarPendientes();
  if (a === 'borrar'){ S.confBorrar = v; return pintar(); }
  if (a === 'borrar-no'){ S.confBorrar = null; return pintar(); }
  if (a === 'borrar-si') return borrarDia(v);
});
function pedirNombre(txt){ var n = window.prompt(txt); return n ? limpiarTxt(n) : ''; }
document.addEventListener('change', function(ev){
  var t = ev.target;
  if (t && t.id === 'ver-claves'){ ['claveNueva', 'claveRepite'].forEach(function(id){ var i = document.getElementById(id); if (i) i.type = t.checked ? 'text' : 'password'; }); return; }
  var f = t.dataset && t.dataset.f; if (!f) return;
  if (f === 'fecha'){ var it = S.items.filter(function(i){ return String(i.id) === t.dataset.id; })[0]; if (it){ it.fecha = T.esIso(t.value) ? t.value : ''; it.fechaAuto = false; } return pintar(); }
  if (f === 'revisado'){ S.revisado = t.checked; return pintar(); }
  if (f === 'revisadoPend'){ S.revisadoPend = t.checked; return pintar(); }
  var mm = /^([dpe])(cat|sub|prov)$/.exec(f); if (!mm) return;
  var pref = mm[1], campo = mm[2], k = t.dataset.k, bolsa = pref === 'd' ? S.dec : (pref === 'p' ? S.pdec : S.edits), base = pref === 'e' ? S.m.clasif.productos[k] : null;
  var cur = bolsa[k] || (base ? { c: base.c, s: base.s || null, v: base.v || null } : { c: '', s: null, v: null }), val = t.value;
  if (campo === 'cat'){
    if (val === NUEVA){ var nc = pedirNombre('Nombre de la nueva categoría:'); if (!nc) return pintar(); if (S.extraCats.indexOf(nc) < 0) S.extraCats.push(nc); val = nc; }
    cur = { c: val, s: null, v: null, sug: false };
  } else if (campo === 'sub'){
    if (val === NUEVA){ var ns = pedirNombre('Nombre del nuevo tipo:'); if (!ns) return pintar(); val = ns; }
    cur = { c: cur.c, s: val || null, v: cur.v, sug: false };
  } else {
    if (val === NUEVA){ var np = pedirNombre('Nombre del nuevo proveedor (por ejemplo, Jaime):'); if (!np) return pintar(); val = np.charAt(0).toUpperCase() + np.slice(1).toLowerCase(); }
    cur = { c: cur.c, s: cur.s, v: val || null, sug: false };
  }
  S.nuevos.forEach(function(n){ if (!S.dec[n.k]){ var sg = sugerir(n.n); if (sg) S.dec[n.k] = sg; } });   // un proveedor recién elegido ya sirve para sugerir el resto
  if (pref === 'e' && base && cur.c === base.c && (cur.s || null) === (base.s || null) && (cur.v || null) === (base.v || null)) delete bolsa[k]; else bolsa[k] = cur;
  pintar();
});
document.addEventListener('input', function(ev){
  var t = ev.target;
  if (t.dataset && t.dataset.f === 'busca'){
    S.busca = t.value; S.verTodas = false;
    var pos = t.selectionStart; pintar(); var n = document.querySelector('[data-f="busca"]'); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch (e){} }
  }
});

/* ============================ ARRANQUE ============================ */
async function iniciar(){
  pintarMensaje('Comprobando acceso…');
  try {
    var ses = getSes(), ok = false;
    if (ses && ses.token){
      try { await API.accion('sesion', {}, ses.token); ok = true; }
      catch (e){ if (!e || e.codigo !== 'SESION') throw e; limpiarSes(); }
    }
    if (!ok) return pintarLogin();
    pintarMensaje('Cargando datos…');
    await recargar(); S.fase = 'listo'; marco();
  } catch (e){
    if (e && e.silencioso) return;
    pintarMensaje('No se han podido cargar los datos', '<p>' + esc(e.message) + '</p>', '<p style="text-align:center"><button type="button" class="btn" onclick="location.reload()">Reintentar</button></p>');
  }
}
window.__loader = { S: S, parseExcel: parseExcel, leerVentas: leerVentas, fechaDeNombre: fechaDeNombre, sugerir: sugerir, iniciar: iniciar };
iniciar();
})();
